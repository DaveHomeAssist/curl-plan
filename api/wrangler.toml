name = "curlplan-sync"
main = "src/index.js"
compatibility_date = "2024-11-01"

# --- fill in after `wrangler d1 create curlplan` ---
[[d1_databases]]
binding = "DB"
database_name = "curlplan"
database_id = "<DATABASE_ID>"   # paste the id printed by `wrangler d1 create curlplan`

[vars]
# Your Clerk instance issuer, e.g. https://your-app.clerk.accounts.dev
# (the Worker verifies JWTs against <issuer>/.well-known/jwks.json — public, no secret).
CLERK_ISSUER = ""
# Required `aud` claim for CurlPlan API tokens.
CLERK_AUDIENCE = ""
# Exact web origin allowed for credentialed CORS, e.g. https://davehomeassist.github.io.
# Wildcards fail closed; use a separate local wrangler environment for development.
CORS_ORIGIN = ""
