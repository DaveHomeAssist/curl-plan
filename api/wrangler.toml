name = "curlplan-sync"
main = "src/index.js"
compatibility_date = "2024-11-01"

# --- fill in after `wrangler d1 create curlplan` ---
[[d1_databases]]
binding = "DB"
database_name = "curlplan"
database_id = "<DATABASE_ID>"   # paste the id printed by `wrangler d1 create curlplan`

[vars]
# Your Clerk instance issuer, e.g. https://your-app.clerk.accounts.dev
# (the Worker verifies JWTs against <issuer>/.well-known/jwks.json — public, no secret).
CLERK_ISSUER = ""
# Required `aud` claim for CurlPlan API tokens.
CLERK_AUDIENCE = ""
# Exact web origin allowed for credentialed CORS, e.g. https://davehomeassist.github.io.
# Wildcards fail closed; use a separate local wrangler environment for development.
CORS_ORIGIN = ""

# Isolated audit-remediation staging plane backed by CurlPlan's dedicated Clerk
# development instance and a disposable-user verification workflow.
[env.staging]
name = "curlplan-sync-staging"
compatibility_date = "2026-08-25"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "curlplan-staging-20260825"
database_id = "d4bd3ef2-b45d-480a-ab3f-61f71bad9d50"
migrations_dir = "./migrations"

[env.staging.vars]
CLERK_ISSUER = "https://welcomed-wombat-9711.clerk.accounts.dev"
CLERK_AUDIENCE = "curlplan-api"
CORS_ORIGIN = "https://davehomeassist.github.io"
