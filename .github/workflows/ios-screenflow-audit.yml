name: iOS screenflow audit

on:
  push:
    branches: [audit/ios-screenflow-*]
  pull_request:
    paths:
      - ".github/workflows/ios-screenflow-audit.yml"
      - "ios/CurlPlanUITests/**"
      - "scripts/select-ios-simulator.sh"
      - "scripts/check-ios-screenshots.py"
  workflow_dispatch:

# GitHub retired macos-14 on 2026-11-02. macos-15 is the supported arm64 image.
# Xcode 16.4 is selected explicitly; Xcode 26 is also on the image and is not used.
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: iphone-6.9
            preferred: "iPhone 16 Pro Max|iPhone 16 Plus"
            label: CurlPlan iPhone Store
            review: "true"
            store_dir: app-store/iphone-6.9
          - id: ipad-13
            preferred: "iPad Pro 13-inch (M4)|iPad Pro (13-inch) (M4)|iPad Pro 13-inch (M5)|iPad Pro (13-inch) (M5)"
            label: CurlPlan iPad 13
            review: "false"
            store_dir: app-store/ipad-13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Generate Xcode project
        run: node ios/generate-xcodeproj.js
      - name: Boot a store simulator
        id: device
        env:
          PREFERRED: ${{ matrix.preferred }}
          LABEL: ${{ matrix.label }}
          REVIEW: ${{ matrix.review }}
          STORE_DIR: ${{ matrix.store_dir }}
          SHOT_ROOT: ${{ runner.temp }}/curlplan-screenshots
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          selected=$(bash scripts/select-ios-simulator.sh "$PREFERRED" "$LABEL")
          UDID=${selected%%$'\t'*}
          NAME=${selected#*$'\t'}
          case "$NAME" in
            "iPhone 16 Pro Max") WIDTH=1320; HEIGHT=2868 ;;
            "iPhone 16 Plus") WIDTH=1290; HEIGHT=2796 ;;
            "iPad Pro 13-inch (M4)"|"iPad Pro (13-inch) (M4)"|"iPad Pro 13-inch (M5)"|"iPad Pro (13-inch) (M5)")
              WIDTH=2064; HEIGHT=2752 ;;
            *) echo "No pixel size mapped for [$NAME]"; exit 1 ;;
          esac
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "width=$WIDTH" >> "$GITHUB_OUTPUT"
          echo "height=$HEIGHT" >> "$GITHUB_OUTPUT"
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          if ! xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100 \
            --operatorName " "; then
            xcrun simctl status_bar "$UDID" override \
              --time "9:41" \
              --dataNetwork wifi \
              --wifiMode active \
              --wifiBars 3 \
              --cellularMode active \
              --cellularBars 4 \
              --batteryState charged \
              --batteryLevel 100
          fi
          mkdir -p "$SHOT_ROOT"
          export UDID NAME WIDTH HEIGHT
          python3 -c 'import json,os; open("/tmp/curlplan-screenshot-config.json","w").write(json.dumps({"output":os.environ["SHOT_ROOT"],"udid":os.environ["UDID"],"deviceName":os.environ["NAME"],"width":int(os.environ["WIDTH"]),"height":int(os.environ["HEIGHT"]),"captureReview":os.environ["REVIEW"]=="true","storeDir":os.environ["STORE_DIR"]}))'
      - name: Capture review and App Store screenshots
        shell: bash
        run: |
          defaults write com.apple.dt.Xcode IDEDisableAutomaticTestingDeviceCloning -bool YES || true
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination "platform=iOS Simulator,id=${{ steps.device.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/curlplan-screenshots.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanScreenshotUITests/testCaptureGallery \
            CODE_SIGNING_ALLOWED=NO
      - name: Check exact pixel dimensions
        if: always() && steps.device.outcome == 'success'
        env:
          SHOT_ROOT: ${{ runner.temp }}/curlplan-screenshots
        run: |
          python3 scripts/check-ios-screenshots.py \
            "$SHOT_ROOT" \
            "${{ steps.device.outputs.width }}" \
            "${{ steps.device.outputs.height }}" \
            "${{ matrix.store_dir }}" \
            "${{ matrix.review }}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curlplan-screenshots-${{ matrix.id }}
          path: ${{ runner.temp }}/curlplan-screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload screenshot result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curlplan-screenshot-result-${{ matrix.id }}
          path: ${{ runner.temp }}/curlplan-screenshots.xcresult
          if-no-files-found: warn
          retention-days: 7

  screenflow:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Generate Xcode project
        run: node ios/generate-xcodeproj.js
      - name: Select standard and small simulators
        id: devices
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          standard=$(bash scripts/select-ios-simulator.sh "iPhone 16|iPhone 16 Pro" "CurlPlan Audit Standard")
          small=$(bash scripts/select-ios-simulator.sh "iPhone SE (3rd generation)|iPhone 16e" "CurlPlan Audit Small")
          standard_id=${standard%%$'\t'*}
          small_id=${small%%$'\t'*}
          test -n "$standard_id"
          test -n "$small_id"
          echo "standard=$standard_id" >> "$GITHUB_OUTPUT"
          echo "small=$small_id" >> "$GITHUB_OUTPUT"
      - name: Drive standard iPhone screenflow
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.standard }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.standard }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.standard }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-ui-standard.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanJourneyUITests/testDemoTabsDetailsAndRelaunch \
            CODE_SIGNING_ALLOWED=NO
      - name: Drive small iPhone screenflow
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.small }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.small }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.small }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-ui-small.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanJourneyUITests/testDemoTabsDetailsAndRelaunch \
            CODE_SIGNING_ALLOWED=NO
      - name: Drive small iPhone with larger text
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.small }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.small }}'
          xcrun simctl boot '${{ steps.devices.outputs.small }}'
          xcrun simctl bootstatus '${{ steps.devices.outputs.small }}' -b
          xcrun simctl ui '${{ steps.devices.outputs.small }}' content_size accessibility-medium
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.small }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-large-type-small.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:CurlPlanUITests/CurlPlanJourneyUITests/testDemoTabsDetailsAndRelaunch \
            CODE_SIGNING_ALLOWED=NO
      # performAccessibilityAudit fails the test when contrast findings exist.
      # Those findings are pre-existing; this workflow does not change the app.
      # The xcresult is still uploaded. The journey steps above stay required.
      - name: Audit standard iPhone accessibility
        if: always() && steps.devices.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.standard }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.standard }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.standard }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-accessibility-standard.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanAccessibilityUITests/testDemoScreenAccessibility \
            CODE_SIGNING_ALLOWED=NO
      - name: Retest small iPhone Passport controls
        if: always() && steps.devices.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.small }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.small }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.small }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-passport-controls-small.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanAccessibilityUITests/testPassportControlAccessibility \
            CODE_SIGNING_ALLOWED=NO
      - name: Audit small iPhone accessibility
        if: always() && steps.devices.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.small }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.small }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.small }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-accessibility-small.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanAccessibilityUITests/testDemoScreenAccessibility \
            CODE_SIGNING_ALLOWED=NO
      - name: Keep simulator screenshots and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curlplan-ios-screenflow
          path: |
            ${{ runner.temp }}/curlplan-ui-*.xcresult
            ${{ runner.temp }}/curlplan-large-type-*.xcresult
            ${{ runner.temp }}/curlplan-accessibility-*.xcresult
            ${{ runner.temp }}/curlplan-passport-controls-*.xcresult
          if-no-files-found: warn
          retention-days: 7
