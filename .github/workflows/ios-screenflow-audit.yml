name: iOS screenflow audit

on:
  push:
    branches: [audit/ios-screenflow-*]
  workflow_dispatch:

jobs:
  screenflow:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Generate Xcode project
        run: node ios/generate-xcodeproj.js
      - name: Select standard and small simulators
        id: devices
        shell: bash
        run: |
          xcrun simctl list devices available
          STANDARD_ID=$(xcrun simctl list devices available | grep -E 'iPhone 15 Pro \(' | head -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          SMALL_ID=$(xcrun simctl list devices available | grep -E 'iPhone SE \(3rd generation\)' | head -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/' || true)
          if [ -z "$SMALL_ID" ]; then
            SMALL_ID=$(xcrun simctl create 'CurlPlan Audit Small' 'iPhone SE (3rd generation)')
          fi
          test -n "$STANDARD_ID"
          test -n "$SMALL_ID"
          echo "standard=$STANDARD_ID" >> "$GITHUB_OUTPUT"
          echo "small=$SMALL_ID" >> "$GITHUB_OUTPUT"
      - name: Drive standard iPhone screenflow
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.standard }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.standard }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.standard }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-ui-standard.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanJourneyUITests/testDemoTabsDetailsAndRelaunch \
            CODE_SIGNING_ALLOWED=NO
      - name: Drive small iPhone screenflow
        shell: bash
        run: |
          xcrun simctl shutdown '${{ steps.devices.outputs.small }}' || true
          xcrun simctl erase '${{ steps.devices.outputs.small }}'
          xcodebuild test \
            -project ios/CurlPlan.xcodeproj \
            -scheme CurlPlan \
            -destination 'platform=iOS Simulator,id=${{ steps.devices.outputs.small }}' \
            -resultBundlePath "$RUNNER_TEMP/curlplan-ui-small.xcresult" \
            -only-testing:CurlPlanUITests/CurlPlanJourneyUITests/testDemoTabsDetailsAndRelaunch \
            CODE_SIGNING_ALLOWED=NO
      - name: Keep simulator screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curlplan-ios-screenflow
          path: ${{ runner.temp }}/curlplan-ui-*.xcresult
          if-no-files-found: warn
          retention-days: 7
