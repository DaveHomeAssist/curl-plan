name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify root Hi-Fi app
        run: node scripts/verify-app.js
      - name: Verify archived classic app
        run: node scripts/verify-split.js
