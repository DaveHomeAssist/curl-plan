name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Feature review gate
        run: |
          BASE_REF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          fi
          FEATURE_REVIEW_BASE="$BASE_REF" make feature-review
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify root Hi-Fi app
        run: node scripts/verify-app.js
      - name: Verify archived classic app
        run: node scripts/verify-split.js
