<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1316">
<meta name="description" content="CurlPlan — your season, your circle. A curling-native app: map your season, stay close to your circle.">
<meta property="og:type" content="website">
<meta property="og:title" content="CurlPlan">
<meta property="og:description" content="Your season, your circle. Map your curling season and stay close to your circle.">
<title>CurlPlan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='13.6' fill='%232f6f93'/%3E%3Ccircle cx='16' cy='16' r='11.2' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='8.4' fill='%23c0402c'/%3E%3Ccircle cx='16' cy='16' r='5.6' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='2.9' fill='%23c0402c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CurlPlan — Hi-Fi Concept implementation
   Single file, no build, no dependencies. Faithful to the
   "Passport + Locker Room" design concept; made navigable.
   ============================================================ */

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  background:radial-gradient(120% 80% at 20% -10%, #19222a 0%, #0e1316 60%);
  color:#e7edf1;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
}

/* ---------- theme tokens (Ice = light, Arena = dark) ---------- */
:root{
  --accent:#c0402c;
  --accent-ink:#ffffff;
  --house-red:#c0402c;
  --house-blue:#2f6f93;
  --ink:#1b2227;
  --muted:#6a747b;
  --line:#dde4e8;
  --screen:#eceff1;
  --card:#ffffff;
  --panel:#e6eef2;
  --pebble-o:0.6;
}
[data-theme="arena"]{
  --ink:#eef3f6;
  --muted:#8a949b;
  --line:rgba(255,255,255,0.09);
  --screen:#13181b;
  --card:#1b2228;
  --panel:#222a31;
}

/* ---------- device frame ---------- */
.phone{
  background:#0a0d0f;
  border-radius:52px;
  padding:11px;
  box-shadow:0 2px 4px rgba(0,0,0,.5), 0 40px 70px -24px rgba(0,0,0,.8), inset 0 0 0 2px #2a3137;
}
.screen{
  position:relative;
  width:384px;
  height:812px;
  max-height:calc(100dvh - 22px);
  border-radius:42px;
  overflow:hidden;
  background:var(--screen);
  display:flex;
  flex-direction:column;
}
.notch{
  position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:104px; height:30px; background:#0a0d0f; border-radius:99px; z-index:40;
  pointer-events:none;
}
/* full-bleed on real phones */
@media (max-width:479px){
  body{ align-items:stretch; }
  .phone{ padding:0; border-radius:0; box-shadow:none; width:100%; }
  .screen{ width:100%; height:100dvh; max-height:none; border-radius:0; }
  .notch{ display:none; }
}

/* ---------- status bar ---------- */
.statusbar{
  height:50px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 28px 7px; font:600 14px 'Hanken Grotesk'; color:var(--ink); z-index:5;
}
.statusbar.on-dark{ color:#fff; }
.statusbar .sig{ display:flex; gap:6px; align-items:center; font-size:12px; letter-spacing:.04em; }
.batt{ margin-left:2px; display:inline-block; width:22px; height:11px; border:1.5px solid currentColor; border-radius:3px; position:relative; }
.batt::after{ content:""; position:absolute; inset:1.5px; right:6px; background:currentColor; border-radius:1px; }

/* ---------- house ring (signature element) ---------- */
.ring{
  display:inline-block; border-radius:99px; flex:none;
  background:radial-gradient(circle, #fff 0 9%, var(--house-red) 9% 35%, #fff 35% 61%, var(--house-blue) 61% 86%, #fff 86% 100%);
}
.ring.tight{
  background:radial-gradient(circle, #fff 0 12%, var(--house-red) 12% 40%, #fff 40% 66%, var(--house-blue) 66% 92%, #fff 92%);
}

/* ---------- generic content scroller ---------- */
.scroll{
  flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; gap:16px; padding:4px 20px 20px;
}
.scroll::-webkit-scrollbar{ width:0; }

/* ---------- app bar ---------- */
.appbar{
  flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 20px 12px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand .ring{ width:22px; height:22px; box-shadow:0 1px 3px rgba(10,15,18,.3); }
.brand b{ font:700 19px 'Hanken Grotesk'; letter-spacing:-.01em; color:var(--ink); }
.avatar{
  border-radius:99px; flex:none; background:linear-gradient(145deg,#3a444b,#222a30);
  display:flex; align-items:center; justify-content:center; color:#eef3f6;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08); font-family:'Hanken Grotesk'; font-weight:700;
  border:0; cursor:pointer;
}

/* ---------- type helpers ---------- */
.eyebrow{ font:500 11px 'DM Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.mono{ font-family:'DM Mono',monospace; }
.serif{ font-family:'Instrument Serif',serif; font-weight:400; }
.accent{ color:var(--accent); }
.ital{ font-style:italic; }

/* ---------- cards & primitives ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 8px 24px -18px rgba(15,20,24,.3);
}
.row{ display:flex; align-items:center; gap:12px; }
.pill-btn{
  font:700 12px 'Hanken Grotesk'; border-radius:10px; padding:8px 14px; border:0; cursor:pointer;
  background:var(--accent); color:#fff;
}
.pill-btn.ghost{ background:transparent; border:1.5px solid var(--ink); color:var(--ink); padding:6.5px 14px; }
.tag{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px;
  padding:6px 11px 6px 7px; font:600 12px 'Hanken Grotesk'; color:var(--ink);
}

/* avatar stack (met-people) */
.stack{ display:flex; }
.stack > span{ box-shadow:inset 0 0 0 1.5px var(--card); }
.stack > span + span{ margin-left:-7px; }

/* ---------- telemetry strip ---------- */
.telemetry{ display:flex; align-items:stretch; padding:13px 4px; }
.telemetry .cell{ flex:1; text-align:center; }
.telemetry .num{ font:400 26px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.telemetry .lab{ font:500 9px 'DM Mono'; letter-spacing:.12em; color:var(--muted); margin-top:4px; }
.vline{ width:1px; background:var(--line); }

/* ---------- map ---------- */
.map{ position:relative; height:212px; border-radius:18px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
.map svg{ position:absolute; inset:0; width:100%; height:100%; }
.pebble-tex{ position:absolute; inset:0; background-image:radial-gradient(rgba(110,130,140,.35) .8px, transparent 1px); background-size:9px 9px; opacity:var(--pebble-o); pointer-events:none; }
.map-pin{
  position:absolute; transform:translate(-50%,-50%); border-radius:99px; cursor:pointer; border:0; padding:0;
  background:radial-gradient(circle, #fff 0 9%, var(--house-red) 9% 35%, #fff 35% 61%, var(--house-blue) 61% 86%, #fff 86% 100%);
  box-shadow:0 1px 3px rgba(10,15,18,.4);
}
.map-pin.here{ box-shadow:0 0 0 3px rgba(255,255,255,.8), 0 3px 8px rgba(10,15,18,.45); }
.map-chip{
  position:absolute; left:14px; top:13px; display:flex; align-items:center; gap:7px;
  background:var(--card); border-radius:99px; padding:5px 11px 5px 7px; box-shadow:0 4px 12px -4px rgba(15,20,24,.35);
}
.map-chip .dot{ width:7px; height:7px; border-radius:99px; background:var(--accent); }
.map-chip span{ font:600 11px 'Hanken Grotesk'; color:var(--ink); }
.map-meta{ position:absolute; right:13px; bottom:12px; font:500 10px 'DM Mono'; letter-spacing:.1em; color:var(--ink); background:var(--card); border-radius:8px; padding:5px 9px; opacity:.92; }

/* ---------- section header ---------- */
.sec-head{ display:flex; align-items:center; justify-content:space-between; }
.sec-head .lab{ font:500 11px 'DM Mono'; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.sec-head .act{ font:600 12px 'Hanken Grotesk'; color:var(--accent); cursor:pointer; }

/* ---------- list row (stops / games / people) ---------- */
.tile{ padding:12px; cursor:pointer; }
.tile .code{
  width:42px; height:42px; border-radius:12px; flex:none; background:var(--panel);
  display:flex; align-items:center; justify-content:center; font:600 12px 'DM Mono'; letter-spacing:.04em; color:var(--accent);
}
.tile .title{ font:700 15px 'Hanken Grotesk'; color:var(--ink); }
.tile .sub{ font:500 11px 'DM Mono'; color:var(--muted); margin-top:2px; }
.score{ font:400 17px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.plus-badge{
  width:20px; height:20px; border-radius:99px; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font:700 8px 'Hanken Grotesk'; color:#fff;
}

/* ---------- tab bar ---------- */
.tabbar{
  flex:none; border-top:1px solid var(--line); background:var(--card);
  display:flex; justify-content:space-around; padding:11px 8px max(26px, env(safe-area-inset-bottom));
  z-index:20;
}
.tab{ display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:0; cursor:pointer; opacity:.5; }
.tab.active{ opacity:1; }
.tab .glyph{ font-size:18px; line-height:.9; color:var(--ink); }
.tab.active .glyph{ color:var(--accent); }
.tab .ring{ width:21px; height:21px; }
.tab.active .lab{ font:600 10px 'Hanken Grotesk'; color:var(--accent); }
.tab .lab{ font:500 10px 'Hanken Grotesk'; color:var(--ink); }

/* ---------- FAB ---------- */
.fab{
  position:absolute; right:18px; bottom:104px; width:54px; height:54px; border-radius:99px;
  background:var(--accent); border:0; cursor:pointer; color:#fff; font:300 30px 'Hanken Grotesk';
  display:flex; align-items:center; justify-content:center; box-shadow:0 12px 26px -8px rgba(192,64,44,.6); z-index:30;
}

/* ---------- feed ---------- */
.post{ padding:14px; }
.post .head{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
.post .name{ font:700 14px 'Hanken Grotesk'; color:var(--ink); }
.post .meta{ font:500 11px 'DM Mono'; color:var(--muted); }
.post .body{ font:400 15px/1.4 'Hanken Grotesk'; color:var(--ink); margin-bottom:11px; }
.scorebar{ display:flex; align-items:center; gap:11px; background:var(--panel); border-radius:12px; padding:10px 13px; }
.scorebar .big{ font:400 28px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.win-chip{ font:700 9px 'DM Mono'; letter-spacing:.12em; background:var(--accent); color:#fff; border-radius:6px; padding:4px 8px; }
.post .actions{ display:flex; gap:20px; margin-top:11px; font:600 13px 'Hanken Grotesk'; color:var(--muted); }
.post .actions span{ cursor:pointer; }
.spiel{ border:1.5px solid var(--accent) !important; box-shadow:0 10px 26px -16px rgba(192,64,44,.45) !important; }

/* ---------- back button ---------- */
.backbtn{
  width:36px; height:36px; border-radius:99px; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--ink);
  background:var(--card); cursor:pointer;
}
.hero-back{
  position:absolute; top:56px; left:18px; width:36px; height:36px; border-radius:99px;
  background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; z-index:6;
}

/* ---------- stop hero ---------- */
.stop-hero{ position:relative; height:228px; flex:none; background:linear-gradient(160deg,#2f6b8f 0%, #1f2d36 100%); overflow:hidden; }
.stop-hero .tex{ position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.18) .9px, transparent 1px); background-size:10px 10px; opacity:var(--pebble-o); }
.stop-hero .arc{ position:absolute; right:-50px; top:-50px; width:200px; height:200px; border-radius:99px; opacity:.5;
  background:radial-gradient(circle, transparent 0 24%, var(--house-red) 24% 30%, transparent 30% 52%, #fff 52% 58%, transparent 58% 80%, var(--house-blue) 80% 86%, transparent 86%); }
.stop-hero .cap{ position:absolute; left:22px; bottom:20px; right:22px; }
.stop-hero .cap .loc{ font:500 10px 'DM Mono'; letter-spacing:.18em; color:rgba(255,255,255,.82); }
.stop-hero .cap h2{ font:400 34px/1.02 'Instrument Serif'; color:#fff; margin:5px 0 0; }

/* ice read */
.iceread{ display:flex; gap:9px; }
.iceread .cell{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px; }
.iceread .v{ font:400 22px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.iceread .v small{ font-size:13px; color:var(--muted); }
.iceread .l{ font:500 9px 'DM Mono'; letter-spacing:.1em; color:var(--muted); margin-top:5px; }

/* games-here list */
.glist{ overflow:hidden; }
.gline{ display:flex; align-items:center; gap:10px; padding:10px 13px; }
.gline + .gline, .glist .ghead + .gline, .gline:not(:last-child){ border-bottom:1px solid var(--line); }
.ghead{ display:flex; align-items:center; justify-content:space-between; padding:11px 13px; border-bottom:1px solid var(--line); }
.ghead .t{ font:600 12px 'Hanken Grotesk'; color:var(--ink); }
.ghead .n{ font:500 10px 'DM Mono'; color:var(--muted); }
.gline .nm{ font:600 13px 'Hanken Grotesk'; color:var(--ink); flex:1; }
.gline .res{ font:700 9px 'DM Mono'; letter-spacing:.1em; }
.statusdot{ width:7px; height:7px; border-radius:99px; flex:none; }

/* people row */
.prow{ display:flex; align-items:center; gap:11px; }
.prow .av{ width:40px; height:40px; font:700 13px 'Hanken Grotesk'; }
.prow .nm{ font:700 14px 'Hanken Grotesk'; color:var(--ink); }
.prow .ro{ font:500 10px 'DM Mono'; color:var(--muted); }

/* ---------- curler profile ---------- */
.identity{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; }
.identity .halo{
  width:88px; height:88px; border-radius:99px; padding:5px; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle, var(--house-red) 0 18%, var(--screen) 18% 30%, var(--house-blue) 30% 44%, var(--screen) 44%);
}
.identity .halo .av{ width:100%; height:100%; font:700 28px 'Hanken Grotesk'; }
.identity h2{ font:400 30px 'Instrument Serif'; color:var(--ink); line-height:1.05; margin:0; }
.identity .meta{ font:500 11px 'DM Mono'; letter-spacing:.08em; color:var(--muted); margin-top:5px; }
.metpill{ display:inline-flex; align-items:center; gap:7px; background:var(--panel); border-radius:99px; padding:5px 12px; font:600 11px 'Hanken Grotesk'; color:var(--accent); }
.metpill .d{ width:6px; height:6px; border-radius:99px; background:var(--accent); }
.actions2{ display:flex; gap:10px; }
.actions2 .b{ flex:1; text-align:center; font:700 14px 'Hanken Grotesk'; border-radius:13px; padding:13px; cursor:pointer; border:0; }
.actions2 .b.solid{ background:var(--accent); color:#fff; }
.actions2 .b.outline{ border:1.5px solid var(--ink); color:var(--ink); background:transparent; padding:11.5px; }

/* empty state */
.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.empty .ring{ width:46px; height:46px; margin:0 auto 14px; opacity:.85; }
.empty h3{ font:400 22px 'Instrument Serif'; color:var(--ink); margin:0 0 6px; }
.empty p{ font:400 14px/1.5 'Hanken Grotesk'; margin:0 auto; max-width:240px; }

/* ---------- settings sheet ---------- */
.sheet-scrim{ position:absolute; inset:0; background:rgba(8,12,15,.55); z-index:50; display:none; }
.sheet-scrim.open{ display:block; }
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:26px 26px 0 0;
  padding:18px 22px max(26px, env(safe-area-inset-bottom)); z-index:51; transform:translateY(100%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);
}
.sheet.open{ transform:translateY(0); }
.sheet .grab{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px; }
.sheet h3{ font:400 24px 'Instrument Serif'; color:var(--ink); margin:0 0 2px; }
.sheet .sub{ font:400 13px 'Hanken Grotesk'; color:var(--muted); margin:0 0 18px; }
.set-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-top:1px solid var(--line); }
.set-row .k{ font:600 14px 'Hanken Grotesk'; color:var(--ink); }
.set-row .k small{ display:block; font:400 11px 'DM Mono'; color:var(--muted); margin-top:2px; letter-spacing:.04em; }
.seg{ display:flex; gap:6px; }
.seg button{
  font:600 12px 'Hanken Grotesk'; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:7px 12px; cursor:pointer;
}
.seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.swatch{ width:26px; height:26px; border-radius:8px; border:2px solid transparent; cursor:pointer; padding:0; }
.swatch.on{ border-color:var(--ink); }
.toggle{ width:46px; height:28px; border-radius:99px; background:var(--line); border:0; cursor:pointer; position:relative; transition:background .2s; }
.toggle.on{ background:var(--accent); }
.toggle::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:99px; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.toggle.on::after{ transform:translateX(18px); }

/* toast */
.toast{
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:var(--screen); font:600 12px 'Hanken Grotesk'; padding:10px 16px; border-radius:99px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">
    <div class="notch"></div>
    <!-- view content injected here -->
    <div id="view" style="display:flex; flex-direction:column; flex:1; min-height:0;"></div>

    <!-- settings sheet -->
    <div class="sheet-scrim" id="scrim" data-action="close-settings"></div>
    <div class="sheet" id="sheet" role="dialog" aria-label="Appearance">
      <div class="grab"></div>
      <h3>Appearance</h3>
      <p class="sub">Same season, your circle — tune the ice.</p>
      <div class="set-row">
        <div class="k">Theme<small>ICE / ARENA</small></div>
        <div class="seg" id="seg-theme">
          <button type="button" data-theme-val="ice">Ice</button>
          <button type="button" data-theme-val="arena">Arena</button>
        </div>
      </div>
      <div class="set-row">
        <div class="k">Accent<small>HOUSE COLOUR</small></div>
        <div class="seg" id="seg-accent"></div>
      </div>
      <div class="set-row">
        <div class="k">Pebble texture<small>ICE GRAIN OVERLAY</small></div>
        <button type="button" class="toggle" id="toggle-pebble" aria-label="Toggle pebble texture"></button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Utilities
   ============================================================ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function el(id){ return document.getElementById(id); }

/* ============================================================
   Appearance prefs (the concept's props made real & persisted)
   ============================================================ */
var ACCENTS = [
  { key:"House red",  val:"#c0402c" },
  { key:"House blue", val:"#2f6f93" },
  { key:"Granite",    val:"#41505a" }
];
var PREFS_KEY = "curlplan-hifi-prefs-v1";
var prefs = loadPrefs();

function loadPrefs(){
  var def = { theme:"ice", accent:"House red", pebble:true };
  try{
    var raw = JSON.parse(localStorage.getItem(PREFS_KEY));
    if(raw && typeof raw === "object"){
      return {
        theme:  raw.theme === "arena" ? "arena" : "ice",
        accent: ACCENTS.some(function(a){return a.key===raw.accent;}) ? raw.accent : "House red",
        pebble: raw.pebble !== false
      };
    }
  }catch(e){}
  return def;
}
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }
function applyQueryOverrides(){
  // optional deep-link overrides, e.g. ?theme=arena&accent=House%20blue&pebble=0 (not persisted)
  try{
    var q = new URLSearchParams(location.search);
    if(q.get("theme")) prefs.theme = q.get("theme") === "arena" ? "arena" : "ice";
    if(q.get("accent") && ACCENTS.some(function(a){return a.key===q.get("accent");})) prefs.accent = q.get("accent");
    if(q.get("pebble")) prefs.pebble = !(q.get("pebble") === "0" || q.get("pebble") === "false");
  }catch(e){}
}
function accentVal(){ var a = ACCENTS.filter(function(x){return x.key===prefs.accent;})[0]; return a ? a.val : "#c0402c"; }

function applyPrefs(){
  var root = document.documentElement;
  root.setAttribute("data-theme", prefs.theme === "arena" ? "arena" : "ice");
  root.style.setProperty("--accent", accentVal());
  root.style.setProperty("--pebble-o", prefs.pebble ? "0.6" : "0");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", prefs.theme === "arena" ? "#13181b" : "#eceff1");
}

        games +
      '</div>' +
      '<div class="sec-head"><span class="lab">People you met here</span><span class="act">+ All</span></div>' +
      '<div style="display:flex; flex-direction:column; gap:12px;">' + people + '</div>' +
    '</div>';
}

function viewCurler(id){
  var c = curler(id);
  if(!c) return viewRoster();
  var st = c.stats;
  var rinks = c.rinks.map(function(r, i){
    var more = i === c.rinks.length - 1 && /more/.test(r);
    return '<span class="tag"' + (more ? ' style="color:var(--muted);"' : '') + '>' +
      (more ? '' : '<span class="ring tight" style="width:12px;height:12px;"></span>') + esc(r) + '</span>';
  }).join("");
  var form = c.form.map(function(f, i){
    return '<div class="gline"' + (i < c.form.length - 1 ? '' : ' style="border-bottom:0;"') + '>' +
      '<span class="nm">' + esc(f.label) + '</span><span class="score">' + esc(f.score) + '</span>' +
      '<span class="res" style="color:' + resColor(f.res) + ';">' + esc(f.res) + '</span></div>';
  }).join("");

  return statusbar(false) +
    '<div style="flex:none; padding:6px 20px 0;"><button class="backbtn" data-action="back" aria-label="Back">‹</button></div>' +
    '<div class="scroll" style="padding-top:10px;">' +
      '<div class="identity">' +
        '<span class="halo">' + avatar(c.initials, 78, 'av') + '</span>' +
        '<div><h2>' + esc(c.name) + '</h2><div class="meta">' + esc(c.role.toUpperCase()) + ' · ' + esc(c.club.toUpperCase()) + ' · ' + esc(c.prov) + '</div></div>' +
        '<span class="metpill"><span class="d"></span>You met at ' + esc(c.metAt) + '</span>' +
      '</div>' +
      '<div class="actions2">' +
        '<button class="b solid" data-action="follow" data-id="' + c.id + '">' + (c.following ? 'Following' : '+ Follow') + '</button>' +
        '<button class="b outline" data-action="message">Message</button>' +
      '</div>' +
      '<div class="card telemetry">' +
        '<div class="cell"><div class="num" style="font-size:24px;">' + esc(st.record) + '</div><div class="lab">RECORD</div></div><div class="vline"></div>' +
        '<div class="cell"><div class="num accent" style="font-size:24px;">' + esc(st.win) + '</div><div class="lab">WIN</div></div><div class="vline"></div>' +
        '<div class="cell"><div class="num" style="font-size:24px;">' + st.rinks + '</div><div class="lab">RINKS</div></div><div class="vline"></div>' +
        '<div class="cell"><div class="num" style="font-size:24px;">' + st.mutual + '</div><div class="lab">MUTUAL</div></div>' +
      '</div>' +
      '<div><div class="eyebrow" style="margin-bottom:9px;">Rinks you\'ve both played</div>' +
        '<div style="display:flex; gap:8px; flex-wrap:wrap;">' + rinks + '</div></div>' +
      '<div><div class="eyebrow" style="margin-bottom:9px;">Recent form</div>' +
        '<div class="card glist">' + form + '</div></div>' +
    '</div>';
}

/* ============================================================
   Router / nav stack
   ============================================================ */
var state = { tab:"passport", stack:[] }; // stack entries: {view:"stop"|"curler", id}

function render(){
  var html, top = state.stack[state.stack.length - 1];
  if(top){
    html = top.view === "stop" ? viewStop(top.id) : viewCurler(top.id);
  } else {
    html = ({ passport:viewPassport, locker:viewLocker, spiels:viewSpiels, roster:viewRoster }[state.tab])();
  }
  el("view").innerHTML = html;
  el("view").scrollTop = 0;
  var sc = el("view").querySelector(".scroll");
  if(sc) sc.scrollTop = 0;
}

function syncHash(){
  var top = state.stack[state.stack.length - 1];
  var h = top ? (top.view + "/" + top.id) : state.tab;
  if(("#" + h) !== location.hash){ history.replaceState(null, "", "#" + h); }
}
function gotoTab(tab){ state.tab = tab; state.stack = []; render(); syncHash(); }
function push(view, id){ state.stack.push({ view:view, id:id }); render(); syncHash(); }
function back(){ state.stack.pop(); render(); syncHash(); }

function applyHash(){
  var h = (location.hash || "").replace(/^#/, "");
  if(!h){ return; }
  var parts = h.split("/");
  if(parts[0] === "stop" && stop(parts[1])){ state.tab = "passport"; state.stack = [{view:"stop", id:parts[1]}]; return; }
  if(parts[0] === "curler" && curler(parts[1])){ state.tab = "roster"; state.stack = [{view:"curler", id:parts[1]}]; return; }
  if(["passport","locker","spiels","roster"].indexOf(parts[0]) > -1){ state.tab = parts[0]; state.stack = []; }
}

/* ============================================================
   Settings sheet
   ============================================================ */
function buildSettings(){
  // accent swatches
  el("seg-accent").innerHTML = ACCENTS.map(function(a){
    return '<button class="swatch" data-accent="' + esc(a.key) + '" style="background:' + a.val + ';" aria-label="' + esc(a.key) + '"></button>';
  }).join("");
  syncSettings();
}
function syncSettings(){
  Array.prototype.forEach.call(el("seg-theme").children, function(b){
    b.classList.toggle("on", b.getAttribute("data-theme-val") === prefs.theme);
  });
  Array.prototype.forEach.call(el("seg-accent").children, function(b){
    b.classList.toggle("on", b.getAttribute("data-accent") === prefs.accent);
  });
  el("toggle-pebble").classList.toggle("on", !!prefs.pebble);
}
function openSettings(){ el("scrim").classList.add("open"); el("sheet").classList.add("open"); }
function closeSettings(){ el("scrim").classList.remove("open"); el("sheet").classList.remove("open"); }

/* ============================================================
   Toast
   ============================================================ */
var toastTimer;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}

/* ============================================================
   Event delegation
   ============================================================ */
el("screen").addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");

  // settings controls (live even without data-action wrapper actions)
  var themeBtn = e.target.closest("[data-theme-val]");
  if(themeBtn){ prefs.theme = themeBtn.getAttribute("data-theme-val"); applyPrefs(); savePrefs(); syncSettings(); return; }
  var accBtn = e.target.closest("[data-accent]");
  if(accBtn){ prefs.accent = accBtn.getAttribute("data-accent"); applyPrefs(); savePrefs(); syncSettings(); return; }
  if(e.target.closest("#toggle-pebble")){ prefs.pebble = !prefs.pebble; applyPrefs(); savePrefs(); syncSettings(); return; }

  if(!t) return;
  var action = t.getAttribute("data-action");
  var id = t.getAttribute("data-id");

  switch(action){
    case "tab":      gotoTab(t.getAttribute("data-tab")); break;
    case "stop":     push("stop", id); break;
    case "curler":   push("curler", id); break;
    case "back":     back(); break;
    case "settings": openSettings(); break;
    case "close-settings": closeSettings(); break;
    case "follow": {
      var c = curler(id);
      if(c){ c.following = !c.following; render(); toast(c.following ? "Following " + c.name : "Unfollowed " + c.name); }
      break;
    }
    case "join":     toast("Saved to your spiels"); break;
    case "compose":  toast("Share a result, review, or spiel"); break;
    case "message":  toast("Messaging coming soon"); break;
    case "like":     toast("Liked"); break;
    default: break;
  }
});

/* ============================================================
   Boot
   ============================================================ */
window.addEventListener("hashchange", function(){ applyHash(); render(); });

applyQueryOverrides();
applyPrefs();
buildSettings();
applyHash();
render();

/* offline support — network-first SW (purges any older CurlPlan cache) */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
}
</script>
