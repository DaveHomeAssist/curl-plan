<html lang="en">
<head>

<meta name="description" content="CurlPlan — your season, your circle. A curling-native app: map your season, stay close to your circle.">

<title>CurlPlan</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CurlPlan — Hi-Fi Concept implementation
   Single file today (dependencies, a build step, and a backend are all welcome). Faithful to the
   "Passport + Locker Room" design concept; made navigable.
   ============================================================ */

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  background:radial-gradient(120% 80% at 20% -10%, #19222a 0%, #0e1316 60%);
  color:#e7edf1;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
}

/* ---------- theme tokens (Ice = light, Arena = dark) ---------- */
:root{
  --accent:#c0402c;
  --accent-ink:#ffffff;
  --house-red:#c0402c;
  --house-blue:#2f6f93;
  --ink:#1b2227;
  --muted:#6a747b;
  --line:#dde4e8;
  --screen:#eceff1;
  --card:#ffffff;
  --panel:#e6eef2;
  --pebble-o:0.6;
}
[data-theme="arena"]{
  --ink:#eef3f6;
  --muted:#8a949b;
  --line:rgba(255,255,255,0.09);
  --screen:#13181b;
  --card:#1b2228;
  --panel:#222a31;
}

/* ---------- device frame ---------- */
.phone{
  background:#0a0d0f;
  border-radius:52px;
  padding:11px;
  box-shadow:0 2px 4px rgba(0,0,0,.5), 0 40px 70px -24px rgba(0,0,0,.8), inset 0 0 0 2px #2a3137;
}
.screen{
  position:relative;
  width:384px;
  height:812px;
  max-height:calc(100dvh - 22px);
  border-radius:42px;
  overflow:hidden;
  background:var(--screen);
  display:flex;
  flex-direction:column;
}
.notch{
  position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:104px; height:30px; background:#0a0d0f; border-radius:99px; z-index:40;
  pointer-events:none;
}
/* full-bleed on real phones */
@media (max-width:479px){
  body{ align-items:stretch; }
  .phone{ padding:0; border-radius:0; box-shadow:none; width:100%; }
  .screen{ width:100%; height:100dvh; max-height:none; border-radius:0; }
  .notch{ display:none; }
}

/* ---------- status bar ---------- */
.statusbar{
  height:50px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 28px 7px; font:600 14px 'Hanken Grotesk'; color:var(--ink); z-index:5;
}
.statusbar.on-dark{ color:#fff; }
.statusbar .sig{ display:flex; gap:6px; align-items:center; font-size:12px; letter-spacing:.04em; }
.batt{ margin-left:2px; display:inline-block; width:22px; height:11px; border:1.5px solid currentColor; border-radius:3px; position:relative; }
.batt::after{ content:""; position:absolute; inset:1.5px; right:6px; background:currentColor; border-radius:1px; }

/* ---------- house ring (signature element) ---------- */
.ring{
  display:inline-block; border-radius:99px; flex:none;
  background:radial-gradient(circle, #fff 0 9%, var(--house-red) 9% 35%, #fff 35% 61%, var(--house-blue) 61% 86%, #fff 86% 100%);
}
.ring.tight{
  background:radial-gradient(circle, #fff 0 12%, var(--house-red) 12% 40%, #fff 40% 66%, var(--house-blue) 66% 92%, #fff 92%);
}

/* ---------- generic content scroller ---------- */
.scroll{
  flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; gap:16px; padding:4px 20px 20px;
}
.scroll::-webkit-scrollbar{ width:0; }

/* ---------- app bar ---------- */
.appbar{
  flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 20px 12px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand .ring{ width:22px; height:22px; box-shadow:0 1px 3px rgba(10,15,18,.3); }
.brand b{ font:700 19px 'Hanken Grotesk'; letter-spacing:-.01em; color:var(--ink); }
.avatar{
  border-radius:99px; flex:none; background:linear-gradient(145deg,#3a444b,#222a30);
  display:flex; align-items:center; justify-content:center; color:#eef3f6;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08); font-family:'Hanken Grotesk'; font-weight:700;
  border:0; cursor:pointer;
}

/* ---------- type helpers ---------- */
.eyebrow{ font:500 11px 'DM Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.mono{ font-family:'DM Mono',monospace; }
.serif{ font-family:'Instrument Serif',serif; font-weight:400; }
.accent{ color:var(--accent); }
.ital{ font-style:italic; }

/* ---------- cards & primitives ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 8px 24px -18px rgba(15,20,24,.3);
}
.row{ display:flex; align-items:center; gap:12px; }
.pill-btn{
  font:700 12px 'Hanken Grotesk'; border-radius:10px; padding:8px 14px; border:0; cursor:pointer;
  background:var(--accent); color:#fff;
}
.pill-btn.ghost{ background:transparent; border:1.5px solid var(--ink); color:var(--ink); padding:6.5px 14px; }
.tag{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px;
  padding:6px 11px 6px 7px; font:600 12px 'Hanken Grotesk'; color:var(--ink);
}

/* avatar stack (met-people) */
.stack{ display:flex; }
.stack > span{ box-shadow:inset 0 0 0 1.5px var(--card); }
.stack > span + span{ margin-left:-7px; }

/* ---------- telemetry strip ---------- */
.telemetry{ display:flex; align-items:stretch; padding:13px 4px; }
.telemetry .cell{ flex:1; text-align:center; }
.telemetry .num{ font:400 26px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.telemetry .lab{ font:500 9px 'DM Mono'; letter-spacing:.12em; color:var(--muted); margin-top:4px; }
.vline{ width:1px; background:var(--line); }

/* ---------- map ---------- */
.map{ position:relative; height:212px; border-radius:18px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
.map svg{ position:absolute; inset:0; width:100%; height:100%; }
.pebble-tex{ position:absolute; inset:0; background-image:radial-gradient(rgba(110,130,140,.35) .8px, transparent 1px); background-size:9px 9px; opacity:var(--pebble-o); pointer-events:none; }
.map-pin{
  position:absolute; transform:translate(-50%,-50%); border-radius:99px; cursor:pointer; border:0; padding:0;
  background:radial-gradient(circle, #fff 0 9%, var(--house-red) 9% 35%, #fff 35% 61%, var(--house-blue) 61% 86%, #fff 86% 100%);
  box-shadow:0 1px 3px rgba(10,15,18,.4);
}
.map-pin.here{ box-shadow:0 0 0 3px rgba(255,255,255,.8), 0 3px 8px rgba(10,15,18,.45); }
.map-chip{
  position:absolute; left:14px; top:13px; display:flex; align-items:center; gap:7px;
  background:var(--card); border-radius:99px; padding:5px 11px 5px 7px; box-shadow:0 4px 12px -4px rgba(15,20,24,.35);
}
.map-chip .dot{ width:7px; height:7px; border-radius:99px; background:var(--accent); }
.map-chip span{ font:600 11px 'Hanken Grotesk'; color:var(--ink); }
.map-meta{ position:absolute; right:13px; bottom:12px; font:500 10px 'DM Mono'; letter-spacing:.1em; color:var(--ink); background:var(--card); border-radius:8px; padding:5px 9px; opacity:.92; }

/* ---------- section header ---------- */
.sec-head{ display:flex; align-items:center; justify-content:space-between; }
.sec-head .lab{ font:500 11px 'DM Mono'; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.sec-head .act{ font:600 12px 'Hanken Grotesk'; color:var(--accent); cursor:pointer; }

/* ---------- list row (stops / games / people) ---------- */
.tile{ padding:12px; cursor:pointer; }
.tile .code{
  width:42px; height:42px; border-radius:12px; flex:none; background:var(--panel);
  display:flex; align-items:center; justify-content:center; font:600 12px 'DM Mono'; letter-spacing:.04em; color:var(--accent);
}
.tile .title{ font:700 15px 'Hanken Grotesk'; color:var(--ink); }
.tile .sub{ font:500 11px 'DM Mono'; color:var(--muted); margin-top:2px; }
.score{ font:400 17px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.plus-badge{
  width:20px; height:20px; border-radius:99px; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font:700 8px 'Hanken Grotesk'; color:#fff;
}

/* ---------- tab bar ---------- */
.tabbar{
  flex:none; border-top:1px solid var(--line); background:var(--card);
  display:flex; justify-content:space-around; padding:11px 8px max(26px, env(safe-area-inset-bottom));
  z-index:20;
}
.tab{ display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:0; cursor:pointer; opacity:.5; }
.tab.active{ opacity:1; }
.tab .glyph{ font-size:18px; line-height:.9; color:var(--ink); }
.tab.active .glyph{ color:var(--accent); }
.tab .ring{ width:21px; height:21px; }
.tab.active .lab{ font:600 10px 'Hanken Grotesk'; color:var(--accent); }
.tab .lab{ font:500 10px 'Hanken Grotesk'; color:var(--ink); }

/* ---------- FAB ---------- */
.fab{
  position:absolute; right:18px; bottom:104px; width:54px; height:54px; border-radius:99px;
  background:var(--accent); border:0; cursor:pointer; color:#fff; font:300 30px 'Hanken Grotesk';
  display:flex; align-items:center; justify-content:center; box-shadow:0 12px 26px -8px rgba(192,64,44,.6); z-index:30;
}

/* ---------- feed ---------- */
.post{ padding:14px; }
.post .head{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
.post .name{ font:700 14px 'Hanken Grotesk'; color:var(--ink); }
.post .meta{ font:500 11px 'DM Mono'; color:var(--muted); }
.post .body{ font:400 15px/1.4 'Hanken Grotesk'; color:var(--ink); margin-bottom:11px; }
.scorebar{ display:flex; align-items:center; gap:11px; background:var(--panel); border-radius:12px; padding:10px 13px; }
.scorebar .big{ font:400 28px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.win-chip{ font:700 9px 'DM Mono'; letter-spacing:.12em; background:var(--accent); color:#fff; border-radius:6px; padding:4px 8px; }
.post .actions{ display:flex; gap:20px; margin-top:11px; font:600 13px 'Hanken Grotesk'; color:var(--muted); }
.post .actions span{ cursor:pointer; }
.spiel{ border:1.5px solid var(--accent) !important; box-shadow:0 10px 26px -16px rgba(192,64,44,.45) !important; }

/* ---------- back button ---------- */
.backbtn{
  width:36px; height:36px; border-radius:99px; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--ink);
  background:var(--card); cursor:pointer;
}
.hero-back{
  position:absolute; top:56px; left:18px; width:36px; height:36px; border-radius:99px;
  background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; z-index:6;
}

/* ---------- stop hero ---------- */
.stop-hero{ position:relative; height:228px; flex:none; background:linear-gradient(160deg,#2f6b8f 0%, #1f2d36 100%); overflow:hidden; }
.stop-hero .tex{ position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.18) .9px, transparent 1px); background-size:10px 10px; opacity:var(--pebble-o); }
.stop-hero .arc{ position:absolute; right:-50px; top:-50px; width:200px; height:200px; border-radius:99px; opacity:.5;
  background:radial-gradient(circle, transparent 0 24%, var(--house-red) 24% 30%, transparent 30% 52%, #fff 52% 58%, transparent 58% 80%, var(--house-blue) 80% 86%, transparent 86%); }
.stop-hero .cap{ position:absolute; left:22px; bottom:20px; right:22px; }
.stop-hero .cap .loc{ font:500 10px 'DM Mono'; letter-spacing:.18em; color:rgba(255,255,255,.82); }
.stop-hero .cap h2{ font:400 34px/1.02 'Instrument Serif'; color:#fff; margin:5px 0 0; }

/* ice read */
.iceread{ display:flex; gap:9px; }
.iceread .cell{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px; }
.iceread .v{ font:400 22px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.iceread .v small{ font-size:13px; color:var(--muted); }
.iceread .l{ font:500 9px 'DM Mono'; letter-spacing:.1em; color:var(--muted); margin-top:5px; }

/* games-here list */
.glist{ overflow:hidden; }
.gline{ display:flex; align-items:center; gap:10px; padding:10px 13px; }
.gline + .gline, .glist .ghead + .gline, .gline:not(:last-child){ border-bottom:1px solid var(--line); }
.ghead{ display:flex; align-items:center; justify-content:space-between; padding:11px 13px; border-bottom:1px solid var(--line); }
.ghead .t{ font:600 12px 'Hanken Grotesk'; color:var(--ink); }
.ghead .n{ font:500 10px 'DM Mono'; color:var(--muted); }
.gline .nm{ font:600 13px 'Hanken Grotesk'; color:var(--ink); flex:1; }
.gline .res{ font:700 9px 'DM Mono'; letter-spacing:.1em; }
.statusdot{ width:7px; height:7px; border-radius:99px; flex:none; }

/* people row */
.prow{ display:flex; align-items:center; gap:11px; }
.prow .av{ width:40px; height:40px; font:700 13px 'Hanken Grotesk'; }
.prow .nm{ font:700 14px 'Hanken Grotesk'; color:var(--ink); }
.prow .ro{ font:500 10px 'DM Mono'; color:var(--muted); }

/* ---------- curler profile ---------- */
.identity{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; }
.identity .halo{
  width:88px; height:88px; border-radius:99px; padding:5px; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle, var(--house-red) 0 18%, var(--screen) 18% 30%, var(--house-blue) 30% 44%, var(--screen) 44%);
}
.identity .halo .av{ width:100%; height:100%; font:700 28px 'Hanken Grotesk'; }
.identity h2{ font:400 30px 'Instrument Serif'; color:var(--ink); line-height:1.05; margin:0; }
.identity .meta{ font:500 11px 'DM Mono'; letter-spacing:.08em; color:var(--muted); margin-top:5px; }
.metpill{ display:inline-flex; align-items:center; gap:7px; background:var(--panel); border-radius:99px; padding:5px 12px; font:600 11px 'Hanken Grotesk'; color:var(--accent); }
.metpill .d{ width:6px; height:6px; border-radius:99px; background:var(--accent); }
.actions2{ display:flex; gap:10px; }
.actions2 .b{ flex:1; text-align:center; font:700 14px 'Hanken Grotesk'; border-radius:13px; padding:13px; cursor:pointer; border:0; }
.actions2 .b.solid{ background:var(--accent); color:#fff; }
.actions2 .b.outline{ border:1.5px solid var(--ink); color:var(--ink); background:transparent; padding:11.5px; }

/* empty state */
.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.empty .ring{ width:46px; height:46px; margin:0 auto 14px; opacity:.85; }
.empty h3{ font:400 22px 'Instrument Serif'; color:var(--ink); margin:0 0 6px; }
.empty p{ font:400 14px/1.5 'Hanken Grotesk'; margin:0 auto; max-width:240px; }

/* ---------- settings sheet ---------- */
.sheet-scrim{ position:absolute; inset:0; background:rgba(8,12,15,.55); z-index:50; display:none; }
.sheet-scrim.open{ display:block; }
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:26px 26px 0 0;
  padding:18px 22px max(26px, env(safe-area-inset-bottom)); z-index:51; transform:translateY(100%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);
}
.sheet.open{ transform:translateY(0); }
.sheet .grab{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px; }
.sheet h3{ font:400 24px 'Instrument Serif'; color:var(--ink); margin:0 0 2px; }
.sheet .sub{ font:400 13px 'Hanken Grotesk'; color:var(--muted); margin:0 0 18px; }
.set-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-top:1px solid var(--line); }
.set-row .k{ font:600 14px 'Hanken Grotesk'; color:var(--ink); }
.set-row .k small{ display:block; font:400 11px 'DM Mono'; color:var(--muted); margin-top:2px; letter-spacing:.04em; }
.seg{ display:flex; gap:6px; }
.seg button{
  font:600 12px 'Hanken Grotesk'; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:7px 12px; cursor:pointer;
}
.seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.swatch{ width:26px; height:26px; border-radius:8px; border:2px solid transparent; cursor:pointer; padding:0; }
.swatch.on{ border-color:var(--ink); }
.toggle{ width:46px; height:28px; border-radius:99px; background:var(--line); border:0; cursor:pointer; position:relative; transition:background .2s; }
.toggle.on{ background:var(--accent); }
.toggle::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:99px; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.toggle.on::after{ transform:translateX(18px); }

/* toast */
.toast{
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:var(--screen); font:600 12px 'Hanken Grotesk'; padding:10px 16px; border-radius:99px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- sheet forms (compose / submissions / messaging) ---------- */
.seg-type{ display:flex; gap:6px; margin:2px 0 16px; }
.seg-type button{
  flex:1; font:600 12px 'Hanken Grotesk'; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:9px 10px; cursor:pointer;
}
.seg-type button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.field{ margin-bottom:13px; }
.field > label{ display:block; font:500 10px 'DM Mono'; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; font:500 14px 'Hanken Grotesk'; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:11px; padding:11px 12px; outline:none;
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
.field textarea{ resize:vertical; min-height:74px; line-height:1.4; }
.field.split{ display:flex; gap:10px; }
.field.split > div{ flex:1; }
.stars-pick{ display:flex; gap:4px; }
.stars-pick button{ background:none; border:0; cursor:pointer; font-size:26px; line-height:1; color:var(--line); padding:0; }
.stars-pick button.on{ color:var(--accent); }
.sheet-actions{ display:flex; gap:10px; margin-top:6px; }
.sheet-actions .b{ flex:1; text-align:center; font:700 14px 'Hanken Grotesk'; border-radius:13px; padding:13px; cursor:pointer; border:0; }
.sheet-actions .b.solid{ background:var(--accent); color:#fff; }
.sheet-actions .b.outline{ border:1.5px solid var(--ink); color:var(--ink); background:transparent; padding:11.5px; }

/* ---------- message thread ---------- */
.thread{ display:flex; flex-direction:column; gap:9px; max-height:300px; overflow-y:auto; padding:4px 2px 10px; }
.thread::-webkit-scrollbar{ width:0; }
.bub{ max-width:78%; padding:9px 13px; border-radius:15px; font:500 14px/1.35 'Hanken Grotesk'; }
.bub .ts{ display:block; font:500 9px 'DM Mono'; letter-spacing:.08em; margin-top:4px; opacity:.6; }
.bub.them{ align-self:flex-start; background:var(--panel); color:var(--ink); border-bottom-left-radius:5px; }
.bub.me{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
.thread-empty{ text-align:center; color:var(--muted); font:400 14px 'Hanken Grotesk'; padding:22px 10px; }
.composer{ display:flex; gap:9px; align-items:flex-end; }
.composer textarea{ flex:1; min-height:44px; max-height:120px; }
.composer button{ flex:none; }

/* small inline submission lists on stop detail */
.subrow{ display:flex; align-items:center; gap:9px; padding:9px 13px; }
.subrow + .subrow{ border-top:1px solid var(--line); }
.subrow .nm{ flex:1; font:600 13px 'Hanken Grotesk'; color:var(--ink); }
.subrow .meta{ font:500 10px 'DM Mono'; color:var(--muted); }
.add-row{ display:flex; gap:8px; flex-wrap:wrap; }

    <div class="notch"></div>
    <!-- view content injected here -->
    <div id="view" style="display:flex; flex-direction:column; flex:1; min-height:0;"></div>

    <!-- settings sheet -->
    <div class="sheet-scrim" id="scrim" data-action="close-settings"></div>
    <div class="sheet" id="sheet" role="dialog" aria-label="Appearance">

      <p class="sub">Same season, your circle — tune the ice.</p>

      <div id="sheet-body"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Utilities
   ============================================================ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function el(id){ return document.getElementById(id); }
/* one localStorage-JSON idiom for prefs, store, and auth */
function readJSON(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }
function writeJSON(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){} }

/* ============================================================
   Appearance prefs (the concept's props made real & persisted)
   ============================================================ */
var ACCENTS = [
  { key:"House red",  val:"#c0402c" },
  { key:"House blue", val:"#2f6f93" },
  { key:"Granite",    val:"#41505a" }
];
var PREFS_KEY = "curlplan-hifi-prefs-v1";
var prefs = loadPrefs();

function loadPrefs(){
  var raw = readJSON(PREFS_KEY);
  if(raw && typeof raw === "object"){
    return {
      theme:  raw.theme === "arena" ? "arena" : "ice",
      accent: ACCENTS.some(function(a){return a.key===raw.accent;}) ? raw.accent : "House red",
      pebble: raw.pebble !== false
    };
  }
  return { theme:"ice", accent:"House red", pebble:true };
}
function savePrefs(){ writeJSON(PREFS_KEY, prefs); }
function applyQueryOverrides(){
  // optional deep-link overrides, e.g. ?theme=arena&accent=House%20blue&pebble=0 (not persisted)
  try{
    var q = new URLSearchParams(location.search);
    if(q.get("theme")) prefs.theme = q.get("theme") === "arena" ? "arena" : "ice";
    if(q.get("accent") && ACCENTS.some(function(a){return a.key===q.get("accent");})) prefs.accent = q.get("accent");
    if(q.get("pebble")) prefs.pebble = !(q.get("pebble") === "0" || q.get("pebble") === "false");
  }catch(e){}
}
function accentVal(){ var a = ACCENTS.filter(function(x){return x.key===prefs.accent;})[0]; return a ? a.val : "#c0402c"; }

function applyPrefs(){
  var root = document.documentElement;
  root.setAttribute("data-theme", prefs.theme === "arena" ? "arena" : "ice");
  root.style.setProperty("--accent", accentVal());
  root.style.setProperty("--pebble-o", prefs.pebble ? "0.6" : "0");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", prefs.theme === "arena" ? "#13181b" : "#eceff1");
}

/* ============================================================
   Seed data — a coherent curling season
   ============================================================ */
// defaultMe = the demo identity (and the "Explore demo" session). A signed-in user
// overrides identity via activeMe(); the season data below stays shared demo data.
var defaultMe = { name:"Dana Mercer", initials:"DM", role:"Skip", club:"Kamloops CC", prov:"BC",
           season:"Season 2025–26 · in progress",
           stats:{ clubs:12, prov:4, games:38, win:68 } };
var me = defaultMe;

// curlers in your circle
var curlers = [
  { id:"sam",  initials:"SR", name:"Sam Reid", role:"Skip",  club:"Vernon CC",   prov:"BC",
    metAt:"Kelowna · Jan 2026", following:false,
    stats:{ record:"21–9", win:"70%", clubs:9, mutual:3 },
    clubs:["Kelowna","Vernon","+4 more"],
    form:[ {label:"A-final · Kelowna", score:"8–5", res:"W"}, {label:"Semi · Kelowna", score:"7–6", res:"W"} ] },
  { id:"jo",   initials:"JM", name:"Jo Mara", role:"Lead · Spare", club:"In roster", prov:"BC",
    metAt:"Kelowna · Jan 2026", following:true,
    stats:{ record:"15–11", win:"58%", clubs:7, mutual:5 },
    clubs:["Kelowna","Kamloops","+2 more"],
    form:[ {label:"Pool · Kelowna", score:"6–4", res:"W"}, {label:"Tie-break · Vernon", score:"5–7", res:"L"} ] },
  { id:"dee",  initials:"DT", name:"Dee Tan", role:"Lead", club:"Glenmore CC", prov:"BC",
    metAt:"Kelowna · Jan 2026", following:false,
    stats:{ record:"12–10", win:"55%", clubs:6, mutual:2 },
    clubs:["Kelowna","Glenmore","+1 more"],
    form:[ {label:"Pool · Kelowna", score:"7–5", res:"W"}, {label:"Pool · Kelowna", score:"4–8", res:"L"} ] },
  { id:"carter", initials:"BC", name:"Bryn Carter", role:"Skip", club:"Sage Valley CC", prov:"AB",
    metAt:"Kelowna · Jan 2026", following:false,
    stats:{ record:"18–12", win:"60%", clubs:8, mutual:1 },
    clubs:["Kelowna","Calgary","+3 more"],
    form:[ {label:"Pool · Kelowna", score:"4–8", res:"L"}, {label:"Final · Calgary", score:"9–7", res:"W"} ] },
  { id:"lind", initials:"EL", name:"Erik Lindqvist", role:"Third", club:"Granite City CC", prov:"MB",
    metAt:"Kelowna · Jan 2026", following:true,
    stats:{ record:"24–8", win:"75%", clubs:11, mutual:2 },
    clubs:["Kelowna","Winnipeg","+5 more"],
    form:[ {label:"Pool · Kelowna", score:"7–5", res:"W"}, {label:"Final · Winnipeg", score:"6–5", res:"W"} ] }
];
function curler(id){ return curlers.filter(function(c){return c.id===id;})[0]; }

// stops on the season map — x/y are % positions on the hero map
var stops = [
  { id:"kamloops", code:"KAM", name:"Kamloops Cashspiel", club:"Kamloops Curling Club", prov:"BC",
    dates:"HERE NOW", record:"—", here:true, x:86, y:54, big:true,
    ice:{ speed:"Fast", speedSec:"23.6s", curl:"4–5", rec:"—" },
    games:[], met:[] },
  { id:"kelowna", code:"KEL", name:"Kelowna Bonspiel", club:"Kelowna Curling Club", prov:"BC",
    dates:"JAN 9–11", record:"3–1", x:70, y:32, plus:"+3",
    ice:{ speed:"Fast", speedSec:"24.1s", curl:"5–6", rec:"3–1" },
    games:[ {opp:"vs Carter", score:"8–4", res:"W"}, {opp:"vs Lindqvist", score:"5–7", res:"L"} ],
    met:["sam","jo","dee"] },
  { id:"vernon", code:"VER", name:"Vernon Cashspiel", club:"Vernon Curling Club", prov:"BC",
    dates:"DEC 2", record:"2–1", x:50, y:68, plus:"+2",
    ice:{ speed:"Medium", speedSec:"25.0s", curl:"4–5", rec:"2–1" },
    games:[ {opp:"vs Reid", score:"6–8", res:"L"}, {opp:"vs Mara", score:"7–5", res:"W"} ],
    met:["sam","jo"] },
  { id:"calgary", code:"CAL", name:"Sage Valley Open", club:"Sage Valley CC", prov:"AB",
    dates:"NOV 14–16", record:"2–2", x:30, y:39,
    ice:{ speed:"Keen", speedSec:"23.2s", curl:"6–7", rec:"2–2" },
    games:[ {opp:"vs Carter", score:"9–7", res:"W"}, {opp:"vs Park", score:"4–9", res:"L"} ],
    met:["carter"] },
  { id:"winnipeg", code:"WPG", name:"Granite City Classic", club:"Granite City CC", prov:"MB",
    dates:"OCT 24–26", record:"3–0", x:14, y:64,
    ice:{ speed:"Fast", speedSec:"24.4s", curl:"5–6", rec:"3–0" },
    games:[ {opp:"vs Lindqvist", score:"6–5", res:"W"}, {opp:"vs Olsen", score:"8–3", res:"W"} ],
    met:["lind"] }
];
function stop(id){ return stops.filter(function(s){return s.id===id;})[0]; }
var recentStops = ["kelowna","vernon"]; // newest season results

// locker-room feed
var feed = [
  { id:"seed-1", type:"result", author:"sam", time:"2H", body:"Took the A-final at Kelowna. Ice was lightning all weekend. 🥌",
    score:{ for:8, ag:5, res:"WIN", vs:"vs Northern" }, likes:24, comments:6 },
  { id:"seed-2", type:"spiel", title:"5 curlers you follow are headed to", spiel:"Brier Patch Open", spielId:"sp1",
    where:"KAMLOOPS", when:"FEB 14–16", who:["sam","jo","lind"] },
  { id:"seed-3", type:"review", author:"jo", time:"5H", club:"Granite City CC", stars:4, note:"fast, 5–6 ft of curl" }
];

// spiels (season schedule)
var spiels = [
  { id:"sp1", name:"Brier Patch Open", where:"Kamloops, BC", when:"FEB 14–16", status:"You're in", going:["sam","jo","lind"] },
  { id:"sp2", name:"Okanagan Classic", where:"Kelowna, BC", when:"MAR 6–8", status:"Watching", going:["dee","carter"] },
  { id:"sp3", name:"Prairie Cashspiel", where:"Winnipeg, MB", when:"MAR 27–29", status:"Invite", going:["lind"] }
];

/* ============================================================
   Persisted app state — the social/log layer the concept
   prototyped but never backed. One JSON blob per session under
   curlplan-hifi-state-v1:<userId|demo> (appearance prefs stay
   separate). Stored locally for now; a server-backed sync can
   replace this later. Seed data is the baseline; the store holds
   the user's overrides + additions. Posts are stamped author:"me"
   — unambiguous because each store belongs to exactly one session.
   ============================================================ */
var STORE_KEY_BASE = "curlplan-hifi-state-v1";
function storeKey(){
  var u = currentUser();
  return STORE_KEY_BASE + ":" + (u ? u.id : "anon");
}
function migrateLegacyStore(){
  // pre-auth builds wrote one device-global blob; that era's data was the
  // demo session's, so move it into the demo bucket once
  try{
    var legacy = localStorage.getItem(STORE_KEY_BASE);
    if(legacy === null) return;
    if(localStorage.getItem(STORE_KEY_BASE + ":demo") === null){
      localStorage.setItem(STORE_KEY_BASE + ":demo", legacy);
    }
    localStorage.removeItem(STORE_KEY_BASE);
  }catch(e){}
}
var store = defaultStore(); // hydrated by refreshStore() at boot and on every auth change

function defaultStore(){
  return {
    v:1,
    follows:{},   // curlerId -> bool (overrides seed `following`)
    likes:{},     // postId -> bool (liked by me)
    joins:{},     // spielId -> status string ("You're in" | "Watching" | "Invite")
    posts:[],     // user-authored feed items, newest-first
    visits:{},    // stopId -> [ {date, note, at} ]
    reviews:{},   // stopId -> [ {stars, note, at} ]
    iceReads:{},  // stopId -> [ {speed, curl, note, at} ]
    threads:{}    // curlerId -> [ {from:"me"|"them", text, at} ]
  };
}
function loadStore(){
  var d = defaultStore();
  var raw = readJSON(storeKey());
  if(raw && typeof raw === "object"){
    ["follows","likes","joins","visits","reviews","iceReads","threads"].forEach(function(k){
      if(raw[k] && typeof raw[k] === "object") d[k] = raw[k];
    });
    if(Array.isArray(raw.posts)) d.posts = raw.posts;
  }
  return sanitizeStore(d);
}
function clampStars(n){ n = parseInt(n, 10); return isNaN(n) ? 1 : Math.max(1, Math.min(5, n)); }
function sanitizeStore(d){
  // per-item guards for hand-edited / older-schema blobs: no renderer should
  // ever see a non-array bucket, a shapeless post, or an out-of-range stars
  ["visits","reviews","iceReads","threads"].forEach(function(k){
    Object.keys(d[k]).forEach(function(id){ if(!Array.isArray(d[k][id])) delete d[k][id]; });
  });
  d.posts = d.posts.filter(function(p){ return p && typeof p === "object" && p.id && p.type; });
  d.posts.forEach(function(p){ if(p.type === "review") p.stars = clampStars(p.stars); });
  Object.keys(d.reviews).forEach(function(id){
    d.reviews[id].forEach(function(r){ if(r && typeof r === "object") r.stars = clampStars(r.stars); });
  });
  return d;
}
function saveStore(){ writeJSON(storeKey(), store); }
function refreshStore(){ store = loadStore(); }
function uid(prefix){ return prefix + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36); }

/* a person record for rendering — seed curlers or "me" */
function person(id){
  if(id === "me") return { id:"me", initials:me.initials, name:me.name, role:me.role, club:me.club };
  return curler(id);
}

/* canonical naming (see Notion "Curling terminology definitions"):
   Club = facility/org, Team = competitive entry referred to by skip,
   display a team as "{Club short} · {Skip}" when collisions matter. */
function clubShort(club){ return String(club || "").replace(/\s+(Curling Club|CC)$/i, "").trim() || String(club || ""); }
function teamLabel(club, skip){ return clubShort(club) + " · " + skip; }
function initialsOf(name){
  var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "··";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}

/* ---- derivations: seed baseline + user overrides ---- */
function isFollowing(c){
  if(!c) return false;
  return store.follows.hasOwnProperty(c.id) ? !!store.follows[c.id] : !!c.following;
}
function setFollowing(id, val){ store.follows[id] = val; saveStore(); }

function isLiked(postId){ return !!store.likes[postId]; }
function likeCount(p){ return (p.likes || 0) + (isLiked(p.id) ? 1 : 0); }
function toggleLike(postId){ store.likes[postId] = !store.likes[postId]; saveStore(); }

function spielStatus(sp){ return store.joins[sp.id] || sp.status; }
function setSpielStatus(id, status){ store.joins[id] = status; saveStore(); }
function spielById(id){ return spiels.filter(function(s){return s.id===id;})[0]; }
function withdrawSpiel(id){
  var sp = spielById(id);
  // dropping the override reverts to the seed status (e.g. back to "Invite");
  // when the seed itself is "You're in", only an explicit override can leave
  if(sp && sp.status === "You're in") store.joins[id] = "Watching";
  else delete store.joins[id];
  saveStore();
}

function allPosts(){ return store.posts.concat(feed); }

/* telemetry for a real account, computed live from their own log —
   demo numbers stay with the demo session (activeMe leaves stats null here) */
function derivedStats(){
  var clubIds = Object.keys(store.visits).filter(function(k){ return (store.visits[k] || []).length; });
  var provs = {};
  clubIds.forEach(function(sid){ var st = stop(sid); if(st) provs[st.prov] = true; });
  var games = 0, wins = 0;
  store.posts.forEach(function(p){
    if(p.type === "result" && p.score){ games++; if(p.score.res === "WIN") wins++; }
  });
  return { clubs:clubIds.length, prov:Object.keys(provs).length, games:games,
    win:games ? Math.round(wins * 100 / games) : 0 };
}
/* a signed-in, non-demo user — the demo session and signed-out both use seed chrome */
function isRealAccount(){ var u = currentUser(); return !!(u && !u.demo); }
/* stops the user has actually logged a visit at, newest visit first */
function visitedStops(){
  return Object.keys(store.visits)
    .filter(function(id){ return (store.visits[id] || []).length && stop(id); })
    .map(function(id){
      var vs = store.visits[id];
      var latest = vs.reduce(function(m, v){ return Math.max(m, v.at || 0); }, 0);
      return { id:id, count:vs.length, at:latest };
    })
    .sort(function(a, b){ return b.at - a.at; });
}

/* ============================================================
   Accounts & auth — user identity + session. Local-first
   scaffold with a backend-ready seam: swap signUp / signIn /
   currentUser for a real API (or the connected Clerk instance)
   and the rest of the app is unchanged. Stored separately under
   curlplan-hifi-auth-v1.
   NOTE: passwords are obfuscated with a non-cryptographic hash
   for this on-device demo only — NOT secure. Real auth should
   run through a backend or Clerk (see CLAUDE.md engineering policy).
   ============================================================ */
var AUTH_KEY = "curlplan-hifi-auth-v1";
var auth = loadAuth();
var authMode = "signin";   // "signin" | "signup"
var authError = "";
// typed-but-not-submitted form values, so an error re-render doesn't wipe the
// form (password intentionally excluded — never re-rendered into markup)
var authDraft = { name:"", club:"", email:"", role:"Skip" };
function resetAuthDraft(){ authDraft = { name:"", club:"", email:"", role:"Skip" }; }

function defaultAuth(){ return { users:[], session:null }; }
function loadAuth(){
  var d = defaultAuth();
  var raw = readJSON(AUTH_KEY);
  if(raw && typeof raw === "object"){
    if(Array.isArray(raw.users)) d.users = raw.users;
    if(typeof raw.session === "string") d.session = raw.session;
  }
  return d;
}
function saveAuth(){ writeJSON(AUTH_KEY, auth); }
function hashPass(s){ // djb2 — obfuscation only, NOT cryptographic
  var h = 5381, str = String(s);
  for(var i = 0; i < str.length; i++){ h = ((h << 5) + h + str.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(36);
}
function userByEmail(email){
  var e = String(email || "").trim().toLowerCase();
  return auth.users.filter(function(u){ return u.email === e; })[0] || null;
}
function currentUser(){
  if(auth.session === "demo"){
    return { id:"demo", name:defaultMe.name, email:"demo@curlplan.app", club:defaultMe.club, role:defaultMe.role, prov:defaultMe.prov, demo:true };
  }
  if(!auth.session) return null;
  return auth.users.filter(function(u){ return u.id === auth.session; })[0] || null;
}
function activeMe(){
  var u = currentUser();
  if(!u || u.demo) return defaultMe;
  return {
    name:u.name, initials:initialsOf(u.name), role:u.role || "Skip",
    club:u.club || defaultMe.club, prov:u.prov || defaultMe.prov,
    season:"Your season · in progress",
    stats:null // real accounts: viewPassport derives live stats from their store
  };
}
function refreshMe(){ me = activeMe(); }

/* --- auth actions (the backend-ready seam) --- */
function signUp(f){
  var name = String(f.name || "").trim(),
      email = String(f.email || "").trim().toLowerCase(),
      pass = String(f.pass || "");
  if(!name) return { ok:false, error:"Add your name" };
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { ok:false, error:"Enter a valid email" };
  if(pass.length < 6) return { ok:false, error:"Password needs 6+ characters" };
  if(userByEmail(email)) return { ok:false, error:"That email already has an account" };
  var user = { id:uid("u"), name:name, email:email, pass:hashPass(pass),
    club:String(f.club || "").trim() || "Independent", role:f.role || "Skip", prov:String(f.prov || "").trim() };
  auth.users.push(user);
  auth.session = user.id;
  saveAuth();
  return { ok:true };
}
function signIn(email, pass){
  var u = userByEmail(email);
  if(!u || u.pass !== hashPass(pass)) return { ok:false, error:"Email or password is incorrect" };
  auth.session = u.id; saveAuth();
  return { ok:true };
}
function signOut(){ auth.session = null; saveAuth(); }

/* ============================================================
   Shared render helpers
   ============================================================ */
function statusbar(onDark){
  return '<div class="statusbar' + (onDark ? ' on-dark' : '') + '">' +
    '<span>9:41</span>' +
    '<span class="sig">●●●<span style="opacity:.4;">●</span><span class="batt"></span></span>' +
    '</div>';
}
function avatar(initials, size, cls){
  var s = size || 34;
  return '<span class="avatar' + (cls ? ' ' + cls : '') + '" style="width:' + s + 'px;height:' + s + 'px;' +
    'font-size:' + Math.round(s*0.36) + 'px;">' + esc(initials) + '</span>';
}
function avatarStack(ids){
  return '<div class="stack">' + ids.map(function(id){
    var c = curler(id);
    return '<span class="avatar" style="width:28px;height:28px;font-size:10px;">' + esc(c ? c.initials : "?") + '</span>';
  }).join("") + '</div>';
}
function resColor(res){ return res === "W" ? "var(--accent)" : "var(--muted)"; }
function likeBtn(p){
  var liked = isLiked(p.id);
  return '<span data-action="like" data-id="' + esc(p.id) + '"' + (liked ? ' style="color:var(--accent);"' : '') + '>' +
    (liked ? "♥" : "♡") + ' ' + likeCount(p) + '</span>';
}
function starsRow(n){
  n = Math.max(0, Math.min(5, parseInt(n, 10) || 0));
  return '<span style="font-size:13px; letter-spacing:2px; color:var(--accent);">' + "★".repeat(n) + '</span>' +
    '<span style="font-size:13px; letter-spacing:2px; color:var(--line);">' + "★".repeat(5 - n) + '</span>';
}
/* the one post header + actions bar every feed card shares */
function postHead(p, o){
  o = o || {};
  var a = person(p.author) || { id:"", initials:"?", name:"Unknown curler", role:"CURLER", club:"—" };

/* titled .glist card for the stop-detail submission lists; "" when empty */
function submissionCard(title, items, rowFn){
  if(!items.length) return "";
  return '<div class="card glist"><div class="ghead"><span class="t">' + esc(title) + '</span><span class="n">' + items.length + '</span></div>' +
    items.map(rowFn).join("") + '</div>';
}

function tabbar(active){
  var tabs = [
    { id:"passport", lab:"Passport", ring:true },
    { id:"locker",   lab:"Locker",   glyph:"≋" },
    { id:"spiels",   lab:"Spiels",   glyph:"◇" },
    { id:"roster",   lab:"Roster",   glyph:"☺" }
  ];
  return '<div class="tabbar">' + tabs.map(function(t){
    var on = t.id === active;
    var icon = t.ring
      ? '<span class="ring"' + (on ? '' : ' style="filter:grayscale(.2);"') + '></span>'
      : '<span class="glyph">' + t.glyph + '</span>';
    return '<button class="tab' + (on ? ' active' : '') + '" data-action="tab" data-tab="' + t.id + '">' +
      icon + '<span class="lab">' + t.lab + '</span></button>';
  }).join("") + '</div>';
}

      'style="left:' + st.x + '%; top:' + st.y + '%; width:' + sz + 'px; height:' + sz + 'px;" aria-label="' + esc(st.name) + '"></button>';
  }).join("");

  var recents;

    var more = i === c.clubs.length - 1 && /more/.test(label);
    return '<span class="tag"' + (more ? ' style="color:var(--muted);"' : '') + '>' +
      (more ? '' : '<span class="ring tight" style="width:12px;height:12px;"></span>') + esc(label) + '</span>';
  }).join("");
  var form = c.form.map(function(f, i){
    return '<div class="gline"' + (i < c.form.length - 1 ? '' : ' style="border-bottom:0;"') + '>' +
      '<span class="nm">' + esc(f.label) + '</span><span class="score">' + esc(f.score) + '</span>' +
      '<span class="res" style="color:' + resColor(f.res) + ';">' + esc(f.res) + '</span></div>';
  }).join("");

  return statusbar(false) +
    '<div style="flex:none; padding:6px 20px 0;"><button class="backbtn" data-action="back" aria-label="Back">‹</button></div>' +
    '<div class="scroll" style="padding-top:10px;">' +
      '<div class="identity">' +
        '<span class="halo">' + avatar(c.initials, 78, 'av') + '</span>' +
        '<div><h2>' + esc(c.name) + '</h2><div class="meta">' + esc(c.role.toUpperCase()) + ' · ' + esc(c.club.toUpperCase()) + ' · ' + esc(c.prov) + '</div></div>' +
        '<span class="metpill"><span class="d"></span>You met at ' + esc(c.metAt) + '</span>' +
      '</div>' +
      '<div class="actions2">' +
        '<button class="b solid" data-action="follow" data-id="' + c.id + '">' + (isFollowing(c) ? 'Following' : '+ Follow') + '</button>' +
        '<button class="b outline" data-action="message" data-id="' + c.id + '">Message</button>' +
      '</div>' +
      '<div class="card telemetry">' +
        '<div class="cell"><div class="num" style="font-size:24px;">' + esc(st.record) + '</div><div class="lab">RECORD</div></div><div class="vline"></div>' +
        '<div class="cell"><div class="num accent" style="font-size:24px;">' + esc(st.win) + '</div><div class="lab">WIN</div></div><div class="vline"></div>' +
        '<div class="cell"><div class="num" style="font-size:24px;">' + st.clubs + '</div><div class="lab">CLUBS</div></div><div class="vline"></div>' +
        '<div class="cell"><div class="num" style="font-size:24px;">' + st.mutual + '</div><div class="lab">MUTUAL</div></div>' +
      '</div>' +
      '<div><div class="eyebrow" style="margin-bottom:9px;">Clubs you\'ve both played</div>' +
        '<div style="display:flex; gap:8px; flex-wrap:wrap;">' + clubChips + '</div></div>' +
      '<div><div class="eyebrow" style="margin-bottom:9px;">Recent form</div>' +
        '<div class="card glist">' + form + '</div></div>' +
    '</div>';
}

/* ============================================================
   Router / nav stack
   ============================================================ */
var state = { tab:"passport", stack:[] }; // stack entries: {view:"stop"|"curler", id}

function render(opts){
  // keepScroll: re-rendering the same view after an in-view mutation (follow,
  // join, submission) must not throw the user back to the top
  var keep = opts && opts.keepScroll, kept = 0;
  if(keep){
    var pre = el("view").querySelector(".scroll");
    kept = pre ? pre.scrollTop : 0;
  }
  if(!currentUser()){ el("view").innerHTML = viewAuth(); el("view").scrollTop = 0; return; }
  var html, top = state.stack[state.stack.length - 1];
  if(top){
    html = top.view === "stop" ? viewStop(top.id) : viewCurler(top.id);
  } else {
    html = ({ passport:viewPassport, locker:viewLocker, spiels:viewSpiels, roster:viewRoster }[state.tab])();
  }
  el("view").innerHTML = html;
  el("view").scrollTop = 0;
  var sc = el("view").querySelector(".scroll");
  if(sc) sc.scrollTop = keep ? kept : 0;
}

function syncHash(){
  var top = state.stack[state.stack.length - 1];
  var h = top ? (top.view + "/" + top.id) : state.tab;
  if(("#" + h) !== location.hash){ history.replaceState(null, "", "#" + h); }
}
function gotoTab(tab){ state.tab = tab; state.stack = []; render(); syncHash(); }
function push(view, id){ state.stack.push({ view:view, id:id }); render(); syncHash(); }
function back(){ state.stack.pop(); render(); syncHash(); }
function enterApp(){
  // after auth success: render whatever the boot deep link restored (default
  // state is the passport) instead of resetting to the passport
  render(); syncHash();
}

function applyHash(){
  var h = (location.hash || "").replace(/^#/, "");
  if(!h){ return; }
  var parts = h.split("/");
  if(parts[0] === "stop" && stop(parts[1])){ state.tab = "passport"; state.stack = [{view:"stop", id:parts[1]}]; return; }
  if(parts[0] === "curler" && curler(parts[1])){ state.tab = "roster"; state.stack = [{view:"curler", id:parts[1]}]; return; }
  if(["passport","locker","spiels","roster"].indexOf(parts[0]) > -1){ state.tab = parts[0]; state.stack = []; }
}

/* ============================================================
   Settings sheet
   ============================================================ */
function buildSettings(){
  // accent swatches
  el("seg-accent").innerHTML = ACCENTS.map(function(a){
    return '<button class="swatch" data-accent="' + esc(a.key) + '" style="background:' + a.val + ';" aria-label="' + esc(a.key) + '"></button>';
  }).join("");
  syncSettings();
}
function syncSettings(){
  Array.prototype.forEach.call(el("seg-theme").children, function(b){
    b.classList.toggle("on", b.getAttribute("data-theme-val") === prefs.theme);
  });
  Array.prototype.forEach.call(el("seg-accent").children, function(b){
    b.classList.toggle("on", b.getAttribute("data-accent") === prefs.accent);
  });
  el("toggle-pebble").classList.toggle("on", !!prefs.pebble);
}
function openSettings(){
  var u = currentUser(), m = el("acct-meta");
  if(m){
    // canonical team identity: "{Club short} · {Skip}" (see terminology page)
    m.textContent = u
      ? (u.demo ? "Demo session · " + teamLabel(me.club, me.name) : u.email + " · " + teamLabel(me.club, me.name))
      : "Signed out";
  }
  el("scrim").classList.add("open"); el("sheet").classList.add("open");
}
function closeSettings(){ el("scrim").classList.remove("open"); el("sheet").classList.remove("open"); }

/* ============================================================
   Toast
   ============================================================ */
var toastTimer;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}

/* ============================================================
   Action sheet (compose / submissions / messaging)
   ============================================================ */
var formStars = 0; // shared picker state — only one sheet is open at a time

function openSheet(html){
  el("sheet-body").innerHTML = html;
  el("scrim2").classList.add("open");
  el("sheet2").classList.add("open");
  var first = el("sheet2").querySelector("input, textarea, select");
  if(first) try{ first.focus(); }catch(e){}
}
function closeSheet(){ el("scrim2").classList.remove("open"); el("sheet2").classList.remove("open"); }
function val(id){ var n = el(id); return n ? n.value.trim() : ""; }

function starPicker(){
  var b = "";
  for(var i = 1; i <= 5; i++){
    b += '<button type="button" class="' + (i <= formStars ? "on" : "") + '" data-action="pick-star" data-val="' + i + '">★</button>';
  }
  return '<div class="stars-pick" id="f-stars">' + b + '</div>';
}
function setStars(n){
  formStars = n;
  var wrap = el("f-stars");
  if(!wrap) return;
  Array.prototype.forEach.call(wrap.children, function(btn, i){
    btn.classList.toggle("on", (i + 1) <= n);
  });
}
function fmtTime(at){
  try{ var d = new Date(at); var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }catch(e){ return ""; }
}
function fmtAgo(at){ // relative label in the seed feed's idiom ("2H", "3D")
  var s = Math.floor((Date.now() - at) / 1000);
  if(s < 60) return "NOW";
  var m = Math.floor(s / 60); if(m < 60) return m + "M";
  var h = Math.floor(m / 60); if(h < 24) return h + "H";
  var d = Math.floor(h / 24); if(d < 7) return d + "D";
  try{ return new Date(at).toLocaleDateString(undefined, { month:"short", day:"numeric" }).toUpperCase(); }
  catch(e){ return d + "D"; }
}
function postTime(p){ return p.at ? fmtAgo(p.at) : (p.time || ""); } // p.time = legacy/seed label

/* ---- compose a feed post ---- */
function openCompose(type){
  type = type || "note";
  formStars = type === "review" ? 5 : 0;
  var seg = ["note","result","review"].map(function(t){
    var lab = t === "note" ? "Note" : t === "result" ? "Result" : "Review";
    return '<button type="button" class="' + (t === type ? "on" : "") + '" data-action="compose-type" data-type="' + t + '">' + lab + '</button>';
  }).join("");

  var body;
  if(type === "result"){
    body = '<div class="field split"><div><label>For</label><input id="f-for" type="number" inputmode="numeric" placeholder="8"></div>' +
      '<div><label>Against</label><input id="f-ag" type="number" inputmode="numeric" placeholder="5"></div></div>' +
      '<div class="field"><label>Opponent</label><input id="f-vs" placeholder="Northern"></div>' +
      '<div class="field"><label>Note (optional)</label><textarea id="f-body" placeholder="How did it go?"></textarea></div>';
  } else if(type === "review"){
    body = '<div class="field"><label>Club</label><input id="f-club" placeholder="Granite City CC"></div>' +
      '<div class="field"><label>Rating</label>' + starPicker() + '</div>' +
      '<div class="field"><label>Note</label><textarea id="f-body" placeholder="fast, 5–6 ft of curl"></textarea></div>';
  } else {
    body = '<div class="field"><label>What\'s the word?</label><textarea id="f-body" placeholder="Share a thought with your circle…"></textarea></div>';
  }

  openSheet('<h3>Share</h3><p class="sub">Posts to your Locker Room — saved on this device.</p>' +
    '<div class="seg-type">' + seg + '</div>' + body +
    '<div class="sheet-actions">' +
      '<button class="b outline" data-action="close-sheet">Cancel</button>' +
      '<button class="b solid" data-action="submit-compose" data-type="' + type + '">Post</button>' +
    '</div>');
}
function submitCompose(type){
  var post;
  if(type === "result"){
    var f = parseInt(val("f-for"), 10), a = parseInt(val("f-ag"), 10);
    if(isNaN(f) || isNaN(a)){ toast("Add both scores"); return; }
    post = { id:uid("p"), type:"result", author:"me", at:Date.now(), body:val("f-body"),
      score:{ for:f, ag:a, res:(f > a ? "WIN" : f < a ? "LOSS" : "TIE"), vs:val("f-vs") ? "vs " + val("f-vs") : "" },
      likes:0, comments:0 };
  } else if(type === "review"){
    var club = val("f-club");
    if(!club){ toast("Name the club"); return; }
    post = { id:uid("p"), type:"review", author:"me", at:Date.now(), club:club, stars:formStars || 1, note:val("f-body") };
  } else {
    var b = val("f-body");
    if(!b){ toast("Write something first"); return; }
    post = { id:uid("p"), type:"note", author:"me", at:Date.now(), body:b, likes:0, comments:0 };
  }
  store.posts.unshift(post);
  saveStore();
  closeSheet();
  gotoTab("locker");
  toast("Posted to your Locker Room");
}

/* ---- stop detail submissions ---- */
function openVisit(stopId){
  var st = stop(stopId); if(!st) return;
  openSheet('<h3>Log a visit</h3><p class="sub">' + esc(st.name) + '</p>' +
    '<div class="field"><label>Date</label><input id="f-date" placeholder="Today"></div>' +
    '<div class="field"><label>Note (optional)</label><textarea id="f-note" placeholder="Draw weight was up, great hosts…"></textarea></div>' +
    '<div class="sheet-actions"><button class="b outline" data-action="close-sheet">Cancel</button>' +
      '<button class="b solid" data-action="submit-visit" data-id="' + stopId + '">Save visit</button></div>');
  if(el("f-date")) el("f-date").value = "Today";
}
/* shared tail for every stop-detail submission */
function addStopEntry(kind, stopId, entry, msg){
  (store[kind][stopId] = store[kind][stopId] || []).unshift(entry);
  saveStore(); closeSheet(); render({keepScroll:true}); toast(msg);
}
function submitVisit(stopId){
  addStopEntry("visits", stopId, { date:val("f-date") || "Today", note:val("f-note"), at:Date.now() }, "Visit logged");
}
function openIceRead(stopId){
  var st = stop(stopId); if(!st) return;
  var opts = ["Keen","Fast","Medium","Slow"].map(function(s){ return '<option>' + s + '</option>'; }).join("");
  openSheet('<h3>Add an ice read</h3><p class="sub">' + esc(st.name) + '</p>' +
    '<div class="field split"><div><label>Speed</label><select id="f-speed">' + opts + '</select></div>' +
      '<div><label>Curl (ft)</label><input id="f-curl" placeholder="4–5"></div></div>' +
    '<div class="field"><label>Note (optional)</label><textarea id="f-note" placeholder="Straight early, more curl after the hog…"></textarea></div>' +
    '<div class="sheet-actions"><button class="b outline" data-action="close-sheet">Cancel</button>' +
      '<button class="b solid" data-action="submit-iceread" data-id="' + stopId + '">Save read</button></div>');
}
function submitIceRead(stopId){
  var curl = val("f-curl");
  if(!curl){ toast("Add a curl figure"); return; }
  addStopEntry("iceReads", stopId, { speed:val("f-speed") || "Medium", curl:curl, note:val("f-note"), at:Date.now() }, "Ice read added");
}
function openReview(stopId){
  var st = stop(stopId); if(!st) return;
  formStars = 5;
  openSheet('<h3>Write a review</h3><p class="sub">' + esc(st.name) + '</p>' +
    '<div class="field"><label>Rating</label>' + starPicker() + '</div>' +
    '<div class="field"><label>Review</label><textarea id="f-note" placeholder="Great ice, friendly club, fast bar service."></textarea></div>' +
    '<div class="sheet-actions"><button class="b outline" data-action="close-sheet">Cancel</button>' +
      '<button class="b solid" data-action="submit-review" data-id="' + stopId + '">Post review</button></div>');
}
function submitReview(stopId){
  addStopEntry("reviews", stopId, { stars:formStars || 1, note:val("f-note"), at:Date.now() }, "Review posted");
}

/* ---- local message thread ---- */
function openThread(curlerId){
  var c = curler(curlerId); if(!c) return;
  var msgs = store.threads[curlerId] || [];
  var body = msgs.length ? '<div class="thread" id="f-thread">' + msgs.map(function(m){
      return '<div class="bub ' + (m.from === "me" ? "me" : "them") + '">' + esc(m.text) +
        '<span class="ts">' + fmtTime(m.at) + '</span></div>';
    }).join("") + '</div>'
    : '<div class="thread-empty">No messages yet. Say hello to ' + esc(c.name.split(" ")[0]) + '.</div>';
  openSheet('<h3>' + esc(c.name) + '</h3><p class="sub">Local thread — saved on this device, not yet delivered.</p>' +
    body +
    '<div class="composer"><textarea id="f-msg" placeholder="Message…"></textarea>' +
      '<button class="pill-btn" data-action="send-msg" data-id="' + curlerId + '">Send</button></div>');
  var th = el("f-thread"); if(th) th.scrollTop = th.scrollHeight;
}
function sendMessage(curlerId){
  var text = val("f-msg");
  if(!text) return;
  var msg = { from:"me", text:text, at:Date.now() };
  (store.threads[curlerId] = store.threads[curlerId] || []).push(msg);
  saveStore();
  var th = el("f-thread");
  if(!th){ openThread(curlerId); return; } // first message: swap the empty state for a thread
  var bub = document.createElement("div"); // append one bubble — keeps composer focus and thread DOM
  bub.className = "bub me";
  bub.innerHTML = esc(msg.text) + '<span class="ts">' + fmtTime(msg.at) + '</span>';
  th.appendChild(bub);
  th.scrollTop = th.scrollHeight;
  el("f-msg").value = "";
}

/* ============================================================
   Event delegation
   ============================================================ */
el("screen").addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");

  // settings controls (live even without data-action wrapper actions)
  var themeBtn = e.target.closest("[data-theme-val]");
  if(themeBtn){ prefs.theme = themeBtn.getAttribute("data-theme-val"); applyPrefs(); savePrefs(); syncSettings(); return; }
  var accBtn = e.target.closest("[data-accent]");
  if(accBtn){ prefs.accent = accBtn.getAttribute("data-accent"); applyPrefs(); savePrefs(); syncSettings(); return; }
  if(e.target.closest("#toggle-pebble")){ prefs.pebble = !prefs.pebble; applyPrefs(); savePrefs(); syncSettings(); return; }

  if(!t) return;
  var action = t.getAttribute("data-action");
  var id = t.getAttribute("data-id");
  var type = t.getAttribute("data-type");

  switch(action){
    case "tab":      gotoTab(t.getAttribute("data-tab")); break;
    case "stop":     push("stop", id); break;
    case "curler":   push("curler", id); break;
    case "back":     back(); break;
    case "settings": openSettings(); break;
    case "close-settings": closeSettings(); break;
    case "close-sheet":    closeSheet(); break;

    // accounts & auth
    case "auth-mode": authMode = t.getAttribute("data-mode"); authError = ""; render(); break;
    case "auth-demo": {
      auth.session = "demo"; saveAuth(); authError = ""; resetAuthDraft();
      refreshStore(); refreshMe(); enterApp();
      break;
    }
    case "submit-signin": {
      var si = signIn(val("au-email"), val("au-pass"));
      if(si.ok){
        authError = ""; resetAuthDraft();
        refreshStore(); refreshMe(); enterApp();
        toast("Welcome back, " + me.name.split(" ")[0]);
      }
      else { authError = si.error; render(); }
      break;
    }
    case "submit-signup": {
      var su = signUp({ name:val("au-name"), email:val("au-email"), pass:val("au-pass"),
        club:val("au-club"), role:(el("au-role") ? el("au-role").value : "Skip") });
      if(su.ok){
        authError = ""; resetAuthDraft();
        refreshStore(); refreshMe(); enterApp();
        toast("Welcome to CurlPlan, " + me.name.split(" ")[0]);
      }
      else { authError = su.error; render(); }
      break;
    }
    case "signout": {
      signOut(); closeSettings(); refreshStore(); refreshMe();
      state.tab = "passport"; state.stack = []; authMode = "signin"; authError = "";
      render(); syncHash(); toast("Signed out");
      break;
    }

    case "follow": {
      var c = curler(id);
      if(c){ var nv = !isFollowing(c); setFollowing(id, nv); render({keepScroll:true}); toast(nv ? "Following " + c.name : "Unfollowed " + c.name); }
      break;
    }
    case "like": {
      if(id){
        toggleLike(id);
        var lp = allPosts().filter(function(x){ return x.id === id; })[0];
        if(lp) t.outerHTML = likeBtn(lp); // patch the heart in place — no re-render, no scroll jump
        else render({keepScroll:true});
      }
      break;
    }

    // bonspiel registration
    case "join-spiel": {
      if(id){ setSpielStatus(id, "You're in"); render({keepScroll:true}); toast("You're registered"); }
      break;
    }
    case "leave-spiel": {
      if(id){ withdrawSpiel(id); render({keepScroll:true}); toast("Registration withdrawn"); }
      break;
    }

    // compose
    case "compose":      openCompose("note"); break;
    case "compose-type": {
      var draft = el("f-body") ? el("f-body").value : ""; // carry the typed body across the type switch
      openCompose(type);
      if(draft && el("f-body")) el("f-body").value = draft;
      break;
    }
    case "submit-compose": submitCompose(type); break;

    // stop detail submissions
    case "log-visit":      openVisit(id); break;
    case "submit-visit":   submitVisit(id); break;
    case "add-iceread":    openIceRead(id); break;
    case "submit-iceread": submitIceRead(id); break;
    case "add-review":     openReview(id); break;
    case "submit-review":  submitReview(id); break;
    case "pick-star":      setStars(parseInt(t.getAttribute("data-val"), 10)); break;

    // messaging
    case "message":   openThread(id); break;
    case "send-msg":  sendMessage(id); break;

    default: break;
  }
});

/* live password-strength meter + draft capture on the auth screen */
var AUTH_DRAFT_FIELDS = { "au-name":"name", "au-club":"club", "au-email":"email", "au-role":"role" };
function onAuthInput(e){
  if(!e.target || !e.target.id) return;
  var key = AUTH_DRAFT_FIELDS[e.target.id];
  if(key){ authDraft[key] = e.target.value; return; }
  if(e.target.id === "au-pass"){
    var bar = el("pw-bar");
    if(bar){
      var v = e.target.value;
      var score = Math.min(4, Math.floor(v.length / 3)) + (/[^a-zA-Z0-9]/.test(v) ? 1 : 0);
      bar.style.width = Math.min(100, score * 22) + "%";
    }
  }
}
el("screen").addEventListener("input", onAuthInput);
el("screen").addEventListener("change", onAuthInput); // <select> coverage on older engines

   Boot
   ============================================================ */
window.addEventListener("hashchange", function(){ applyHash(); render(); });

applyQueryOverrides();
applyPrefs();
buildSettings();
applyHash();
migrateLegacyStore();
refreshStore();
refreshMe();
render();

/* offline support — network-first SW (purges any older CurlPlan cache) */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
}
