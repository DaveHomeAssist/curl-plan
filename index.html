/* ============================================================
   CurlPlan — Hi-Fi Concept implementation
   Single file today (dependencies, a build step, and a backend are all welcome). Faithful to the
   "Passport + Locker Room" design concept; made navigable.
   ============================================================ */

@font-face{
  font-family:'Hanken Grotesk'; font-style:normal; font-weight:400 800; font-display:swap;
  src:url('fonts/hanken-grotesk-latin.woff2') format('woff2');
}
@font-face{
  font-family:'Instrument Serif'; font-style:normal; font-weight:400; font-display:swap;
  src:url('fonts/instrument-serif-400-latin.woff2') format('woff2');
}
@font-face{
  font-family:'Instrument Serif'; font-style:italic; font-weight:400; font-display:swap;
  src:url('fonts/instrument-serif-400-italic-latin.woff2') format('woff2');
}
@font-face{
  font-family:'DM Mono'; font-style:normal; font-weight:400; font-display:swap;
  src:url('fonts/dm-mono-400-latin.woff2') format('woff2');
}
@font-face{
  font-family:'DM Mono'; font-style:normal; font-weight:500; font-display:swap;
  src:url('fonts/dm-mono-500-latin.woff2') format('woff2');
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  background:radial-gradient(120% 80% at 20% -10%, #19222a 0%, #0e1316 60%);
  color:#e7edf1;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
}

/* ---------- theme tokens (Ice = light, Arena = dark) ---------- */
:root{
  --accent:#c0402c;
  --accent-ink:#ffffff;
  --accent-deep:#a83a28; /* accent tuned to >=4.5:1 on --panel for small text (M-03) */
  --house-red:#c0402c;
  --house-blue:#2f6f93;
  --ink:#1b2227;
  --muted:#596168;
  --line:#dde4e8;
  --screen:#eceff1;
  --card:#ffffff;
  --panel:#e6eef2;
  --pebble-o:0.6;
}
[data-theme="arena"]{
  --accent-deep:#e58270;
  --ink:#eef3f6;
  --muted:#a7b0b6;
  --line:rgba(255,255,255,0.09);
  --screen:#13181b;
  --card:#1b2228;
  --panel:#222a31;
}

/* ---------- device frame ---------- */
.phone{
  background:#0a0d0f;
  border-radius:52px;
  padding:11px;
  box-shadow:0 2px 4px rgba(0,0,0,.5), 0 40px 70px -24px rgba(0,0,0,.8), inset 0 0 0 2px #2a3137;
}
.screen{
  position:relative;
  width:384px;
  height:812px;
  max-height:calc(100dvh - 22px);
  border-radius:42px;
  overflow:hidden;
  background:var(--screen);
  color:var(--ink);
  display:flex;
  flex-direction:column;
}
.notch{
  position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:104px; height:30px; background:#0a0d0f; border-radius:99px; z-index:40;
  pointer-events:none;
}
/* full-bleed on real phones */
@media (max-width:479px){
  body{ align-items:stretch; }
  .phone{ padding:0; border-radius:0; box-shadow:none; width:100%; }
  .screen{ width:100%; height:100dvh; max-height:none; border-radius:0; }
  .notch{ display:none; }
}

/* Touch devices use the actual viewport, including the on-screen keyboard. */
@media (pointer:coarse){
  body{ align-items:stretch; min-height:var(--app-viewport-height, 100dvh); }
  .phone{ width:100%; padding:0; border-radius:0; box-shadow:none; }
  .screen{ width:100%; height:var(--app-viewport-height, 100dvh); max-height:none; border-radius:0; }
  .notch{ display:none; }
}

/* ---------- status bar ---------- */
.statusbar{
  height:50px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 28px 7px; font:600 14px 'Hanken Grotesk'; color:var(--ink); z-index:5;
}
.statusbar.on-dark{ color:#fff; }
.statusbar .sig{ display:flex; gap:6px; align-items:center; font-size:12px; letter-spacing:.04em; }
.batt{ margin-left:2px; display:inline-block; width:22px; height:11px; border:1.5px solid currentColor; border-radius:3px; position:relative; }
.batt::after{ content:""; position:absolute; inset:1.5px; right:6px; background:currentColor; border-radius:1px; }

/* ---------- house ring (signature element) ---------- */
.ring{
  display:inline-block; border-radius:99px; flex:none;
  background:radial-gradient(circle, #fff 0 9%, var(--house-red) 9% 35%, #fff 35% 61%, var(--house-blue) 61% 86%, #fff 86% 100%);
}
.ring.tight{
  background:radial-gradient(circle, #fff 0 12%, var(--house-red) 12% 40%, #fff 40% 66%, var(--house-blue) 66% 92%, #fff 92%);
}

/* ---------- generic content scroller ---------- */
.scroll{
  flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; gap:16px; padding:4px 20px 20px;
}
.scroll::-webkit-scrollbar{ width:0; }

/* ---------- app bar ---------- */
.appbar{
  flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 20px 12px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand .ring{ width:22px; height:22px; box-shadow:0 1px 3px rgba(10,15,18,.3); }
.brand b{ font:700 19px 'Hanken Grotesk'; letter-spacing:-.01em; color:var(--ink); }
.avatar{
  border-radius:99px; flex:none; background:linear-gradient(145deg,#3a444b,#222a30);
  display:flex; align-items:center; justify-content:center; color:#eef3f6;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08); font-family:'Hanken Grotesk'; font-weight:700;
  border:0; cursor:pointer;
}
.appearance-trigger{
  width:44px; height:44px; padding:5px; border:0; border-radius:99px; background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}

/* ---------- type helpers ---------- */
.eyebrow{ font:500 11px 'DM Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.mono{ font-family:'DM Mono',monospace; }
.serif{ font-family:'Instrument Serif',serif; font-weight:400; }
.accent{ color:var(--accent); }
.accent-deep{ color:var(--accent-deep); }
.ital{ font-style:italic; }

/* ---------- cards & primitives ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 8px 24px -18px rgba(15,20,24,.3);
}
.row{ display:flex; align-items:center; gap:12px; }
.pill-btn{
  font:700 12px 'Hanken Grotesk'; border-radius:10px; padding:8px 14px; border:0; cursor:pointer;
  background:var(--accent); color:#fff;
}
.pill-btn.ghost{ background:transparent; border:1.5px solid var(--ink); color:var(--ink); padding:6.5px 14px; }
.tag{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px;
  padding:6px 11px 6px 7px; font:600 12px 'Hanken Grotesk'; color:var(--ink);
}

/* avatar stack (met-people) */
.stack{ display:flex; }
.stack > span{ box-shadow:inset 0 0 0 1.5px var(--card); }
.stack > span + span{ margin-left:-7px; }

/* ---------- telemetry strip ---------- */
.telemetry{ display:flex; align-items:stretch; padding:13px 4px; }
.telemetry .cell{ flex:1; text-align:center; }
.telemetry .num{ font:400 26px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.telemetry .lab{ font:500 9px 'DM Mono'; letter-spacing:.12em; color:var(--muted); margin-top:4px; }
.vline{ width:1px; background:var(--line); }

/* ---------- map ---------- */
.map{ position:relative; height:212px; border-radius:18px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
.map svg{ position:absolute; inset:0; width:100%; height:100%; }
.pebble-tex{ position:absolute; inset:0; background-image:radial-gradient(rgba(110,130,140,.35) .8px, transparent 1px); background-size:9px 9px; opacity:var(--pebble-o); pointer-events:none; }
.map-pin{
  position:absolute; transform:translate(-50%,-50%); border-radius:99px; cursor:pointer; border:0; padding:0;
  background:radial-gradient(circle, #fff 0 9%, var(--house-red) 9% 35%, #fff 35% 61%, var(--house-blue) 61% 86%, #fff 86% 100%);
  box-shadow:0 1px 3px rgba(10,15,18,.4);
}
.map-pin.here{ box-shadow:0 0 0 3px rgba(255,255,255,.8), 0 3px 8px rgba(10,15,18,.45); }
.map-chip{
  position:absolute; left:14px; top:13px; display:flex; align-items:center; gap:7px;
  background:var(--card); border-radius:99px; padding:5px 11px 5px 7px; box-shadow:0 4px 12px -4px rgba(15,20,24,.35);
}
.map-chip .dot{ width:7px; height:7px; border-radius:99px; background:var(--accent); }
.map-chip span{ font:600 11px 'Hanken Grotesk'; color:var(--ink); }
.map-meta{ position:absolute; right:13px; bottom:12px; font:500 10px 'DM Mono'; letter-spacing:.1em; color:var(--ink); background:var(--card); border-radius:8px; padding:5px 9px; opacity:.92; }

/* ---------- section header ---------- */
.sec-head{ display:flex; align-items:center; justify-content:space-between; }
.sec-head .lab{ font:500 11px 'DM Mono'; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.sec-head .act{ font:600 12px 'Hanken Grotesk'; color:var(--accent-deep); cursor:pointer; }

/* ---------- list row (stops / games / people) ---------- */
.tile{ padding:12px; cursor:pointer; }
.tile .code{
  width:42px; height:42px; border-radius:12px; flex:none; background:var(--panel);
  display:flex; align-items:center; justify-content:center; font:600 12px 'DM Mono'; letter-spacing:.04em; color:var(--accent-deep);
}
.tile .title{ font:700 15px 'Hanken Grotesk'; color:var(--ink); }
.tile .sub{ font:500 11px 'DM Mono'; color:var(--muted); margin-top:2px; }
.card .sub{ font:500 11px 'DM Mono'; color:var(--muted); } /* non-tile cards (Spiels) otherwise inherit the page-frame color (M-03) */
.score{ font:400 17px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.plus-badge{
  width:20px; height:20px; border-radius:99px; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font:700 8px 'Hanken Grotesk'; color:#fff;
}

/* ---------- tab bar ---------- */
.tabbar{
  flex:none; border-top:1px solid var(--line); background:var(--card);
  display:flex; justify-content:space-around; padding:11px 8px max(26px, env(safe-area-inset-bottom));
  z-index:20;
}
.tab{
  min-width:44px; min-height:44px; padding:0 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  background:none; border:0; cursor:pointer; opacity:.72; /* .5 dropped inactive labels below 4.5:1 (M-03) */
}
.tab.active{ opacity:1; }
.tab .glyph{ font-size:18px; line-height:.9; color:var(--ink); }
.tab.active .glyph{ color:var(--accent); }
.tab .ring{ width:21px; height:21px; }
.tab.active .lab{ font:600 10px 'Hanken Grotesk'; color:var(--accent-deep); }
.tab .lab{ font:500 10px 'Hanken Grotesk'; color:var(--ink); }

/* ---------- FAB ---------- */
.fab{
  position:absolute; right:18px; bottom:104px; width:54px; height:54px; border-radius:99px;
  background:var(--accent); border:0; cursor:pointer; color:#fff; font:300 30px 'Hanken Grotesk';
  display:flex; align-items:center; justify-content:center; box-shadow:0 12px 26px -8px rgba(192,64,44,.6); z-index:30;
}

/* ---------- feed ---------- */
.post{ padding:14px; }
.post .head{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
.post .name{ font:700 14px 'Hanken Grotesk'; color:var(--ink); }
.post .meta{ font:500 11px 'DM Mono'; color:var(--muted); }
.post .body{ font:400 15px/1.4 'Hanken Grotesk'; color:var(--ink); margin-bottom:11px; }
.scorebar{ display:flex; align-items:center; gap:11px; background:var(--panel); border-radius:12px; padding:10px 13px; }
.scorebar .big{ font:400 28px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.win-chip{ font:700 9px 'DM Mono'; letter-spacing:.12em; background:var(--accent); color:#fff; border-radius:6px; padding:4px 8px; }
.post .actions{ display:flex; gap:20px; margin-top:11px; font:600 13px 'Hanken Grotesk'; color:var(--muted); }
.post .actions span{ cursor:pointer; }
.spiel{ border:1.5px solid var(--accent) !important; box-shadow:0 10px 26px -16px rgba(192,64,44,.45) !important; }

/* ---------- back button ---------- */
.backbtn{
  width:36px; height:36px; border-radius:99px; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--ink);
  background:var(--card); cursor:pointer;
}
.hero-back{
  position:absolute; top:56px; left:18px; width:36px; height:36px; border-radius:99px;
  background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; z-index:6;
}

/* ---------- stop hero ---------- */
.stop-hero{ position:relative; height:228px; flex:none; background:linear-gradient(160deg,#2f6b8f 0%, #1f2d36 100%); overflow:hidden; }
.stop-hero .tex{ position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.18) .9px, transparent 1px); background-size:10px 10px; opacity:var(--pebble-o); }
.stop-hero .arc{ position:absolute; right:-50px; top:-50px; width:200px; height:200px; border-radius:99px; opacity:.5;
  background:radial-gradient(circle, transparent 0 24%, var(--house-red) 24% 30%, transparent 30% 52%, #fff 52% 58%, transparent 58% 80%, var(--house-blue) 80% 86%, transparent 86%); }
.stop-hero .cap{ position:absolute; left:22px; bottom:20px; right:22px; }
.stop-hero .cap .loc{ font:500 10px 'DM Mono'; letter-spacing:.18em; color:rgba(255,255,255,.82); }
.stop-hero .cap h1{ font:400 34px/1.02 'Instrument Serif'; color:#fff; margin:5px 0 0; }

/* ice read */
.iceread{ display:flex; gap:9px; }
.iceread .cell{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px; }
.iceread .v{ font:400 22px 'Instrument Serif'; color:var(--ink); line-height:1; white-space:nowrap; }
.iceread .v small{ font-size:13px; color:var(--muted); }
.iceread .l{ font:500 9px 'DM Mono'; letter-spacing:.1em; color:var(--muted); margin-top:5px; }

/* games-here list */
.glist{ overflow:hidden; }
.gline{ display:flex; align-items:center; gap:10px; padding:10px 13px; }
.gline + .gline, .glist .ghead + .gline, .gline:not(:last-child){ border-bottom:1px solid var(--line); }
.ghead{ display:flex; align-items:center; justify-content:space-between; padding:11px 13px; border-bottom:1px solid var(--line); }
.ghead .t{ font:600 12px 'Hanken Grotesk'; color:var(--ink); }
.ghead .n{ font:500 10px 'DM Mono'; color:var(--muted); }
.gline .nm{ font:600 13px 'Hanken Grotesk'; color:var(--ink); flex:1; }
.gline .res{ font:700 9px 'DM Mono'; letter-spacing:.1em; }
.statusdot{ width:7px; height:7px; border-radius:99px; flex:none; }

/* people row */
.prow{ display:flex; align-items:center; gap:11px; }
.prow .av{ width:40px; height:40px; font:700 13px 'Hanken Grotesk'; }
.prow .nm{ font:700 14px 'Hanken Grotesk'; color:var(--ink); }
.prow .ro{ font:500 10px 'DM Mono'; color:var(--muted); }

/* ---------- curler profile ---------- */
.identity{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:9px; }
.identity .halo{
  width:88px; height:88px; border-radius:99px; padding:5px; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle, var(--house-red) 0 18%, var(--screen) 18% 30%, var(--house-blue) 30% 44%, var(--screen) 44%);
}
.identity .halo .av{ width:100%; height:100%; font:700 28px 'Hanken Grotesk'; }
.identity h1{ font:400 30px 'Instrument Serif'; color:var(--ink); line-height:1.05; margin:0; }
.identity .meta{ font:500 11px 'DM Mono'; letter-spacing:.08em; color:var(--muted); margin-top:5px; }
.metpill{ display:inline-flex; align-items:center; gap:7px; background:var(--panel); border-radius:99px; padding:5px 12px; font:600 11px 'Hanken Grotesk'; color:var(--accent-deep); }
.metpill .d{ width:6px; height:6px; border-radius:99px; background:var(--accent); }
.actions2{ display:flex; gap:10px; }
.actions2 .b{ flex:1; text-align:center; font:700 14px 'Hanken Grotesk'; border-radius:13px; padding:13px; cursor:pointer; border:0; }
.actions2 .b.solid{ background:var(--accent); color:#fff; }
.actions2 .b.outline{ border:1.5px solid var(--ink); color:var(--ink); background:transparent; padding:11.5px; }

/* empty state */
.empty{ text-align:center; padding:40px 20px; color:var(--muted); }
.empty .ring{ width:46px; height:46px; margin:0 auto 14px; opacity:.85; }
.empty h3{ font:400 22px 'Instrument Serif'; color:var(--ink); margin:0 0 6px; }
.empty p{ font:400 14px/1.5 'Hanken Grotesk'; margin:0 auto; max-width:240px; }

/* ---------- settings sheet ---------- */
.sheet-scrim{ position:absolute; inset:0; background:rgba(8,12,15,.55); z-index:50; display:none; }
.sheet-scrim.open{ display:block; }
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:26px 26px 0 0;
  padding:18px 22px max(26px, env(safe-area-inset-bottom)); z-index:51; transform:translateY(100%);
  max-height:100%; overflow-y:auto; overscroll-behavior:contain;
  transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);
}
.sheet.open{ transform:translateY(0); }
.sheet .grab{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 14px; }
.sheet h2{ font:400 24px 'Instrument Serif'; color:var(--ink); margin:0 0 2px; }
.sheet .sub{ font:400 13px 'Hanken Grotesk'; color:var(--muted); margin:0 0 18px; }
.set-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-top:1px solid var(--line); }
.set-row .k{ font:600 14px 'Hanken Grotesk'; color:var(--ink); }
.set-row .k small{ display:block; font:400 11px 'DM Mono'; color:var(--muted); margin-top:2px; letter-spacing:.04em; }
.seg{ display:flex; gap:6px; }
.seg button{
  font:600 12px 'Hanken Grotesk'; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:7px 12px; cursor:pointer;
}
.seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.swatch{ width:26px; height:26px; border-radius:8px; border:2px solid transparent; cursor:pointer; padding:0; }
.swatch.on{ border-color:var(--ink); }
.toggle{ width:46px; height:28px; border-radius:99px; background:var(--line); border:0; cursor:pointer; position:relative; transition:background .2s; }
.toggle.on{ background:var(--accent); }
.toggle::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:99px; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.toggle.on::after{ transform:translateX(18px); }

/* toast */
.toast{
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:var(--screen); font:600 12px 'Hanken Grotesk'; padding:10px 16px; border-radius:99px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- sheet forms (compose / submissions / messaging) ---------- */
.seg-type{ display:flex; gap:6px; margin:2px 0 16px; }
.seg-type button{
  flex:1; font:600 12px 'Hanken Grotesk'; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:9px; padding:9px 10px; cursor:pointer;
}
.seg-type button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.field{ margin-bottom:13px; }
.field label{ display:block; font:500 10px 'DM Mono'; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; font:500 14px 'Hanken Grotesk'; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:11px; padding:11px 12px; outline:none;
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
.field textarea{ resize:vertical; min-height:74px; line-height:1.4; }
.field.split{ display:flex; gap:10px; }
.field.split > div{ flex:1; }
.stars-pick{ display:flex; gap:4px; }
.stars-pick button{ background:none; border:0; cursor:pointer; font-size:26px; line-height:1; color:var(--line); padding:0; }
.stars-pick button.on{ color:var(--accent); }
summary{ min-height:44px; padding:10px 0; cursor:pointer; }
.sheet-actions{ display:flex; gap:10px; margin-top:6px; }
.sheet-actions .b{ flex:1; }
.b{ min-height:44px; text-align:center; font:700 14px 'Hanken Grotesk'; border-radius:13px; padding:13px; cursor:pointer; border:0; }
.b.solid{ background:var(--accent); color:#fff; }
.b.outline{ border:1.5px solid var(--ink); color:var(--ink); background:transparent; padding:11.5px; }

/* ---------- message thread ---------- */
.thread{ display:flex; flex-direction:column; gap:9px; max-height:300px; overflow-y:auto; padding:4px 2px 10px; }
.thread::-webkit-scrollbar{ width:0; }
.bub{ max-width:78%; padding:9px 13px; border-radius:15px; font:500 14px/1.35 'Hanken Grotesk'; }
.bub .ts{ display:block; font:500 9px 'DM Mono'; letter-spacing:.08em; margin-top:4px; opacity:.6; }
.bub.them{ align-self:flex-start; background:var(--panel); color:var(--ink); border-bottom-left-radius:5px; }
.bub.me{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
.thread-empty{ text-align:center; color:var(--muted); font:400 14px 'Hanken Grotesk'; padding:22px 10px; }
.composer{ display:flex; gap:9px; align-items:flex-end; }
.composer textarea{ flex:1; min-height:44px; max-height:120px; }
.composer button{ flex:none; }

/* small inline submission lists on stop detail */
.subrow{ display:flex; align-items:center; gap:9px; padding:9px 13px; }
.subrow + .subrow{ border-top:1px solid var(--line); }
.subrow .nm{ flex:1; font:600 13px 'Hanken Grotesk'; color:var(--ink); }
.subrow .meta{ font:500 10px 'DM Mono'; color:var(--muted); }
.add-row{ display:flex; gap:8px; flex-wrap:wrap; }
.add-row .pill-btn.ghost{ flex:1; text-align:center; }

/* ---------- auth screen ---------- */
.auth-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:15px; padding:8px 22px 30px; overflow-y:auto; }
.auth-wrap::-webkit-scrollbar{ width:0; }
.auth-head{ text-align:center; }
.auth-head .ring{ width:46px; height:46px; display:inline-block; margin-bottom:10px; box-shadow:0 2px 8px rgba(10,15,18,.3); }
.auth-head h1{ font:400 32px 'Instrument Serif'; color:var(--ink); margin:0; line-height:1.05; }
.auth-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 14px 34px -22px rgba(15,20,24,.4); }
.auth-alt{ text-align:center; font:500 14px 'Hanken Grotesk'; color:var(--muted); }
.auth-alt b{ color:var(--accent); cursor:pointer; }
.auth-notice{ margin:0; color:var(--ink); font:600 14px/1.5 'Hanken Grotesk'; }
.auth-notice strong{ color:var(--accent); }
.auth-footnote{ margin:12px 0 0; color:var(--muted); font:500 13px/1.45 'Hanken Grotesk'; }
.classic-bridge{ padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
.classic-bridge a{ display:inline-flex; align-items:center; min-height:44px; color:var(--accent-deep); font:700 14px 'Hanken Grotesk'; text-decoration:underline; text-underline-offset:3px; }
.classic-bridge p{ margin:0; color:var(--muted); font:500 12px/1.4 'Hanken Grotesk'; }
.classic-bridge a:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

/* Keyboard and touch affordances stay consistent across the app shell. */
button, [role="button"]{ touch-action:manipulation; }
button:focus-visible, [role="button"]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}
.pill-btn, .backbtn, .hero-back, .seg button, .seg-type button, .swatch, .toggle, .stars-pick button{
  min-width:44px; min-height:44px;
}
.map-pin::after{ content:""; position:absolute; inset:-12px; }
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{ scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}

/* ============================================================
   Persisted app state — the social/log layer the concept
   prototyped but never backed. One JSON blob per session under
   curlplan-hifi-state-v1:<userId|demo> (appearance prefs stay
   separate). Stored locally for now; a server-backed sync can
   replace this later. Seed data is the baseline; the store holds
   the user's overrides + additions. Posts are stamped author:"me"
   — unambiguous because each store belongs to exactly one session.
   ============================================================ */
var STORE_KEY_BASE = "curlplan-hifi-state-v1";
function storeKey(){
  var u = currentUser();
  return STORE_KEY_BASE + ":" + (u ? u.id : "anon");
}
function migrateLegacyStore(){
  // pre-auth builds wrote one device-global blob; that era's data was the
  // demo session's, so move it into the demo bucket once
  try{
    var legacy = localStorage.getItem(STORE_KEY_BASE);
    if(legacy === null) return;
    if(localStorage.getItem(STORE_KEY_BASE + ":demo") === null){
      localStorage.setItem(STORE_KEY_BASE + ":demo", legacy);
    }
    localStorage.removeItem(STORE_KEY_BASE);
  }catch(e){}
}
var store = defaultStore(); // hydrated by refreshStore() at boot and on every auth change

var STORE_SCHEMA = 3; // v3: LWW maps carry {v, at} so the CRDT merge (src/merge.js) can converge
function defaultStore(){
  return {
    v:STORE_SCHEMA,
    // LWW-Register per key — entry = { v, at } so two devices' edits merge by max at
    follows:{},   // curlerId -> { v:bool,   at }  (overrides seed `following`)
    likes:{},     // postId   -> { v:bool,   at }  (liked by me)
    joins:{},     // spielId  -> { v:status, at }  ("You're in" | "Watching" | "Invite")
    drafts:{}, tombstones:{}, // local recovery and durable deletion markers
    posts:[],     // OR-Set by id — user-authored feed items, newest-first
    visits:{},    // stopId -> OR-Set [ {id?, date, note, at} ]
    reviews:{},   // stopId -> OR-Set [ {id?, stars, note, at} ]
    iceReads:{},  // stopId -> OR-Set [ {id?, date?, sheet?, speed, curl, note, at} ]
    threads:{},   // curlerId -> OR-Set [ {id?, from, text, at} ]
    addedSpiels:[],  // OR-Set by id — user-created spiels (seed + these = allSpiels())
    addedCurlers:[]  // OR-Set by id — user-created curlers (seed + these = allCurlers())
  };
}
/* wrap a bare v1/v2 LWW value (bool/string) as a v3 timestamped entry;
   at:0 so any later explicit action always wins the merge */
function lwwEntry(v, at){ return { v:v, at:(at || 0) }; }
function lwwVal(entry){ return (entry && typeof entry === "object" && "v" in entry) ? entry.v : entry; }
function loadStore(){
  var d = defaultStore();
  var raw = readJSON(storeKey());
  if(raw && typeof raw === "object"){
    ["follows","likes","joins","visits","reviews","iceReads","threads","drafts","tombstones"].forEach(function(k){
      if(raw[k] && typeof raw[k] === "object" && !Array.isArray(raw[k])) d[k] = raw[k];
    });
    if(Array.isArray(raw.posts)) d.posts = raw.posts;
    if(Array.isArray(raw.addedSpiels)) d.addedSpiels = raw.addedSpiels;
    if(Array.isArray(raw.addedCurlers)) d.addedCurlers = raw.addedCurlers;
  }
  return sanitizeStore(d);
}
function clampStars(n){ n = parseInt(n, 10); return isNaN(n) ? 1 : Math.max(1, Math.min(5, n)); }
function sanitizeStore(d){
  // per-item guards for hand-edited / older-schema blobs: no renderer should
  // ever see a non-array bucket, a shapeless post, or an out-of-range stars
  ["visits","reviews","iceReads","threads"].forEach(function(k){
    Object.keys(d[k]).forEach(function(id){ if(!Array.isArray(d[k][id])) delete d[k][id]; });
  });
  d.posts = d.posts.filter(function(p){ return p && typeof p === "object" && p.id && p.type; });
  d.posts.forEach(function(p){ if(p.type === "review") p.stars = clampStars(p.stars); });
  Object.keys(d.reviews).forEach(function(id){
    d.reviews[id] = d.reviews[id].filter(function(r){ return r && typeof r === "object"; });
    d.reviews[id].forEach(function(r, i){ r.stars = clampStars(r.stars); if(!r.id) r.id = "legacy-review-" + id + "-" + (r.at || 0) + "-" + i; });
  });
  d.addedSpiels = d.addedSpiels.filter(function(s){ return s && typeof s === "object" && s.id && s.name; });
  d.addedCurlers = d.addedCurlers.filter(function(c){ return c && typeof c === "object" && c.id && c.name; });
  // schema v3 migration: normalize LWW maps to { v, at } (bare v1/v2 bool/string
  // values become at:0 so a later explicit action wins); drop malformed entries
  ["follows","likes","joins"].forEach(function(k){
    var m = d[k];
    Object.keys(m).forEach(function(key){
      var e = m[key];
      if(e && typeof e === "object" && "v" in e) m[key] = { v:e.v, at:+e.at || 0 };
      else if(typeof e === "boolean" || typeof e === "string" || typeof e === "number") m[key] = lwwEntry(e, 0);
      else delete m[key];
    });
  });
  d.v = STORE_SCHEMA;
  return d;
}
/* derived collections: user additions (per-account) + seed baseline */
function allSpiels(){ return store.addedSpiels.concat(spiels); }
function allCurlers(){ return store.addedCurlers.concat(curlers); }
/* Persistence. Content writes (posts, visits, reviews, messages, joins, added*)
   stay synchronous — durable immediately. Hot high-frequency writes (likes,
   follows) debounce via saveStoreSoon to avoid a full stringify per tap. The
   pending write captures its target key, so a flush after a sign-out can never
   land in the next account's bucket. */
var _hotTimer = null, _hotPending = null;
function saveStore(){ flushStoreSoon(); writeJSON(storeKey(), store); }
function saveStoreSoon(){
  _hotPending = { key:storeKey(), obj:store };
  if(_hotTimer) return;
  _hotTimer = setTimeout(flushStoreSoon, 500);
}
function flushStoreSoon(){
  if(_hotTimer){ clearTimeout(_hotTimer); _hotTimer = null; }
  if(!_hotPending) return;
  writeJSON(_hotPending.key, _hotPending.obj);
  _hotPending = null;
}
function refreshStore(){ flushStoreSoon(); store = loadStore(); } // drain before switching accounts
function uid(prefix){ return prefix + "-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36); }

/* a person record for rendering — seed curlers or "me" */
function person(id){
  if(id === "me") return { id:"me", initials:me.initials, name:me.name, role:me.role, club:me.club };
  return curler(id);
}

/* canonical naming (see Notion "Curling terminology definitions"):
   Club = facility/org, Team = competitive entry referred to by skip,
   display a team as "{Club short} · {Skip}" when collisions matter. */
function clubShort(club){ return String(club || "").replace(/\s+(Curling Club|CC)$/i, "").trim() || String(club || ""); }
function teamLabel(club, skip){ return clubShort(club) + " · " + skip; }
function initialsOf(name){
  var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "··";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}

/* ---- derivations: seed baseline + user overrides ---- */
function isFollowing(c){
  if(!c) return false;
  return store.follows.hasOwnProperty(c.id) ? !!lwwVal(store.follows[c.id]) : !!c.following;
}
function setFollowing(id, val){ store.follows[id] = lwwEntry(val, Date.now()); saveStoreSoon(); }

function attendanceIntent(value){
  if(value === "You're in") return "Going";
  return ["Going","Considering","Not going"].includes(value) ? value : "Considering";
}
function spielStatus(sp){
  var saved = lwwVal(store.joins[sp.id]);
  if(saved) return attendanceIntent(saved);
  return store.addedSpiels.some(function(s){return s.id === sp.id;}) ? attendanceIntent(sp.status) : "Considering";
}
function setSpielStatus(id, status){
  if(!currentUser() || !spielById(id) || !["Going","Considering","Not going"].includes(status)) return false;
  var next = JSON.parse(JSON.stringify(store));
  next.joins[id] = lwwEntry(status, Date.now());
  return commitLocal(next);
}
function spielById(id){ return allSpiels().filter(function(s){return s.id===id;})[0]; }
function withdrawSpiel(id){ return setSpielStatus(id, "Not going"); }

function allPosts(){ return store.posts.concat(feed); }

/* Personal telemetry reflects saved local records, including demo additions. */
function derivedStats(){
  var clubIds = Object.keys(store.visits).filter(function(k){ return (store.visits[k] || []).length; });
  var provs = {};
  clubIds.forEach(function(sid){ var st = stop(sid); if(st) provs[st.prov] = true; });
  var games = 0, wins = 0;
  store.posts.forEach(function(p){
    if(p.type === "result" && p.score){ games++; if(p.score.res === "WIN") wins++; }
  });
  return { clubs:clubIds.length, prov:Object.keys(provs).length, games:games,
    win:games ? Math.round(wins * 100 / games) : 0 };
}
/* a signed-in, non-demo user — the demo session and signed-out both use seed chrome */
function isRealAccount(){ var u = currentUser(); return !!(u && !u.demo); }
/* stops the user has actually logged a visit at, newest visit first */
function visitedStops(){
  return Object.keys(store.visits)
    .filter(function(id){ return (store.visits[id] || []).length && stop(id); })
    .map(function(id){
      var vs = store.visits[id];
      var latest = vs.reduce(function(m, v){ return Math.max(m, v.at || 0); }, 0);
      return { id:id, count:vs.length, at:latest };
    })
    .sort(function(a, b){ return b.at - a.at; });
}

/* ============================================================
   Demo session gate. Public password collection is intentionally
   disabled until the Clerk + D1 backend is configured end to end.
   The migration removes legacy password records from the auth key
   without deleting a user's separate local season data.
   ============================================================ */
var AUTH_KEY = "curlplan-hifi-auth-v1";
var auth = loadAuth();
function defaultAuth(){ return { session:null }; }
function loadAuth(){
  var d = defaultAuth();
  var raw = readJSON(AUTH_KEY);
  if(raw && typeof raw === "object"){
    if(raw.session === "demo") d.session = "demo";
    if(Array.isArray(raw.users) || raw.session !== d.session) writeJSON(AUTH_KEY, d);
  }
  return d;
}
function saveAuth(){ writeJSON(AUTH_KEY, auth); }
function currentUser(){
  if(auth.session === "demo"){
    return { id:"demo", name:defaultMe.name, email:"demo@curlplan.app", club:defaultMe.club, role:defaultMe.role, prov:defaultMe.prov, demo:true };
  }
  return null;
}
function activeMe(){
  return defaultMe;
}
function refreshMe(){ me = activeMe(); }
function signOut(){ auth.session = null; saveAuth(); }

/* ---- locker feed: Following/Discover filter + search (list re-renders alone
       so the search box keeps focus between keystrokes) ---- */
function postMatches(p, q){
  var a = person(p.author);
  var hay = [a && a.name, p.body, p.score && p.score.vs, p.club, p.note, p.spiel, p.title, p.where]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(q) > -1;
}
function lockerPosts(){
  var list = allPosts();
  if(ui.lockerTab === "following"){
    // Following = your posts, shared spiels, and posts by curlers you follow
    list = list.filter(function(p){
      if(p.author === "me" || p.type === "spiel") return true;
      var c = curler(p.author);
      return c ? isFollowing(c) : true;
    });
  }
  var q = (ui.lockerQ || "").trim().toLowerCase();
  if(q) list = list.filter(function(p){ return postMatches(p, q); });
  return list;
}
function renderPostCard(p){
  if(p.type === "result"){
    return '<div class="card post">' + postHead(p) +
      (p.body ? '<div class="body">' + esc(p.body) + '</div>' : '') +
      (p.eventID ? (spielById(p.eventID) ? '<button class="b outline" data-action="result-event" data-id="' + esc(p.eventID) + '">Event: ' + esc(spielById(p.eventID).name) + '</button>' : '<p>Event: ' + esc(p.eventName || 'Removed event') + ' (removed)</p>') : '') +
      '<div class="scorebar"><span class="big">' + esc(p.score.for) + '<span style="color:var(--muted);"> – </span>' + esc(p.score.ag) + '</span>' +
        '<span class="win-chip">' + esc(p.score.res) + '</span>' +
        '<span style="margin-left:auto;" class="meta">' + esc(p.score.vs) + '</span></div>' +
    '</div>';
  }
  if(p.type === "note" || p.type === "practice"){
    return '<div class="card post">' + postHead(p) +
      '<div class="body" style="white-space:pre-line;">' + esc(p.body) + '</div>' +
      (lessonText(p.id) ? '<button class="b outline" data-action="prepare-lesson" data-id="' + esc(p.id) + '">Use in game preparation</button>' : '') +
    '</div>';
  }
  if(p.type === "spiel"){
    var sp = spielById(p.spielId);
    var spielBtn = !sp ? '' : (spielStatus(sp) === "Going"
      ? '<button class="pill-btn ghost" style="margin-left:auto; border-radius:11px; padding:7.5px 16px; font-size:13px;" data-action="leave-spiel" aria-label="' + esc("Mark not going locally: " + sp.name) + '" data-id="' + esc(sp.id) + '">Going locally ✓</button>'
      : '<button class="pill-btn" style="margin-left:auto; border-radius:11px; padding:9px 16px; font-size:13px;" data-action="join-spiel" aria-label="' + esc("Mark going locally: " + sp.name) + '" data-id="' + esc(sp.id) + '">Mark going locally</button>');
    return '<div class="card spiel post" style="padding:14px;">' +
      '<div class="mono" style="font-size:10px; letter-spacing:.14em; color:var(--accent-deep); margin-bottom:7px;">SHARED SPIEL</div>' +
      '<div class="serif" style="font-size:19px; line-height:1.25; color:var(--ink); margin-bottom:11px;">' +
        esc(p.title) + ' <span class="ital">' + esc(p.spiel) + '</span></div>' +
      '<div class="row">' + avatarStack(p.who) +
        '<div class="mono" style="font-size:11px; color:var(--muted); line-height:1.3;">' + esc(p.where) + '<br>' + esc(p.when) + '</div>' +
        spielBtn +
      '</div>' +
    '</div>';
  }
  // review
  return '<div class="card post">' +
    postHead(p, { size:32, nameSize:13, metaSize:10, noMenu:true, meta:'CLUB REVIEW · ' + esc(postTime(p)) }) +
    '<div class="serif" style="font-size:16px; color:var(--ink); white-space:nowrap;">' + esc(p.club) + '</div>' +
    '<div class="row" style="gap:8px; margin-top:4px;">' + starsRow(p.stars) +
      '<span style="font:400 13px \'Hanken Grotesk\'; color:var(--muted);">— ' + esc(p.note) + '</span></div>' +
  '</div>';
}
function lockerCards(){
  var list = lockerPosts();

function viewSpiels(){

  var undated = allSpiels().filter(function(s){return !Number.isFinite(s.startAt);});
  var rows = upcoming.concat(dated,undated).map(function(sp){
    var owned = store.addedSpiels.some(function(s){return s.id === sp.id;});
    var status = spielStatus(sp);
    var solid = status === "Going";
    var btn = '<div role="group" aria-label="Local attendance intent" style="display:flex; flex-wrap:wrap; gap:8px;">' + ["Going","Considering","Not going"].map(function(option){
      return '<button class="pill-btn' + (status === option ? '' : ' ghost') + '" aria-pressed="' + (status === option) + '" aria-label="' + esc(option + ': ' + sp.name) + '" data-action="attendance-intent" data-id="' + esc(sp.id) + '" data-status="' + option + '">' + option + '</button>';
    }).join('') + '</div>';
    if(owned) btn = '<button class="pill-btn ghost" aria-label="' + esc("Edit event: " + sp.name) + '" data-action="edit-event" data-id="' + esc(sp.id) + '">Edit event</button><button class="pill-btn ghost" aria-label="' + esc("Delete event: " + sp.name) + '" data-action="delete-event" data-id="' + esc(sp.id) + '">Delete event</button>';
    var conflicts = Number.isFinite(sp.startAt) && status !== "Not going" ? eventConflicts(sp.startAt,sp.endAt,sp.id) : [];
    var section = Number.isFinite(sp.startAt) ? (upcomingIDs.includes(sp.id) ? 'Upcoming / in progress' : 'Past / not going') : 'Undated / sample';
    return '<div class="card" style="padding:14px;">' + '<div class="eyebrow">' + section + '</div>' +
      '<div class="row" style="align-items:flex-start;">' +
        '<div style="flex:1; min-width:0;">' +
          '<div class="mono" style="font-size:10px; letter-spacing:.14em; color:var(--muted);">' + esc(eventLabel(sp)) + '</div>' +
          '<div class="serif" style="font-size:21px; color:var(--ink); line-height:1.1; margin-top:3px;">' + esc(sp.name) + '</div>' +
          '<div class="sub" style="margin-top:4px;">' + esc(sp.where) + '</div>' +
        '</div>' +
        '<span class="' + (solid ? 'win-chip' : 'tag') + '" style="' + (solid ? '' : 'padding:5px 10px;') + '">' + esc(status) + '</span>' +
      '</div>' +
      '<div class="row" style="margin-top:12px;">' + avatarStack(sp.going) +
        '<span class="meta mono" style="color:var(--muted); font-size:11px;">' + sp.going.length + ' of your circle going</span>' +
        '</div><div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">' + btn + '</div>' +
      (sp.preparation ? '<p>Preparation: ' + esc(sp.preparation) + '</p>' : '') +
      '<details><summary aria-label="' + esc('Event details: ' + sp.name) + '">Event details and trip planning</summary><p>Personal notes; confirm details with the organizer.</p><dl>' + eventPlanningFields.map(function(f){return '<dt>' + f[1] + '</dt><dd>' + esc(sp.planning && sp.planning[f[0]] || 'Not recorded') + '</dd>';}).join('') + '</dl></details>' +
      (conflicts.length ? '<p>Overlaps with: ' + esc(conflicts.map(function(c){return c.name;}).join(', ')) + '</p>' : '') +
    '</div>';
  }).join("");

  return statusbar(false) +
    '<div class="appbar"><h1 class="serif" style="font-size:28px; color:var(--ink); margin:0;">Spiels</h1>' +
      '<button class="backbtn" data-action="new-spiel" aria-label="Add event" style="font-size:20px;">+</button></div>' +
    '<div class="scroll">' +
      '<p>Attendance intent is saved on this device; it is not registration.</p>' +
      (upcoming.length ? '<div class="card" style="padding:14px;"><strong>Next event</strong><p>' + esc(upcoming[0].name + ' · ' + eventLabel(upcoming[0]) + ' · ' + upcoming[0].where) + '</p></div>' : '<p>No upcoming dated events. Use Add event to plan your next game, practice or bonspiel.</p>') +
      rows +
    '</div>' +
    tabbar("spiels");
}

var state = { tab:"passport", stack:[] }; // stack entries: {view:"stop"|"curler", id}
// transient view UI (search boxes, locker filter) — not persisted
var ui = { lockerTab:"following", lockerSearch:false, lockerQ:"", rosterSearch:false, rosterQ:"" };

function render(opts){
  // keepScroll: re-rendering the same view after an in-view mutation (follow,
  // join, submission) must not throw the user back to the top
  var keep = opts && opts.keepScroll, kept = 0;
  if(keep){
    var pre = el("view").querySelector(".scroll");
    kept = pre ? pre.scrollTop : 0;
  }
  if(!currentUser()){ el("view").innerHTML = viewAuth(); el("view").scrollTop = 0; return; }
  var html, top = state.stack[state.stack.length - 1];
  if(top){
    html = top.view === "stop" ? viewStop(top.id) : viewCurler(top.id);
  } else {
    html = ({ passport:viewPassport, locker:viewLocker, spiels:viewSpiels, roster:viewRoster }[state.tab])();
  }
  el("view").innerHTML = html;
  el("view").scrollTop = 0;
  var sc = el("view").querySelector(".scroll");
  if(sc) sc.scrollTop = keep ? kept : 0;
}

function syncHash(mode){
  var top = state.stack[state.stack.length - 1];
  var h = top ? (top.view + "/" + top.id) : state.tab;
  if(("#" + h) !== location.hash){
    if(mode === "replace") history.replaceState(null, "", "#" + h);
    else history.pushState({curlplanRoute:true}, "", "#" + h);
  }
}
function gotoTab(tab){ state.tab = tab; state.stack = []; render(); syncHash(); }
function push(view, id){ state.stack.push({ view:view, id:id }); render(); syncHash(); }
function back(){
  if(history.state && history.state.curlplanRoute){ history.back(); return; }
  state.stack.pop(); render(); syncHash("replace");
}
function enterApp(){
  // after auth success: render whatever the boot deep link restored (default
  // state is the passport) instead of resetting to the passport
  render(); syncHash("replace");
}

function applyHash(){
  var h = (location.hash || "").replace(/^#/, "");
  if(!h){ return; }
  var parts = h.split("/");
  if(parts[0] === "stop" && stop(parts[1])){ state.tab = "passport"; state.stack = [{view:"stop", id:parts[1]}]; return; }
  if(parts[0] === "curler" && curler(parts[1])){ state.tab = "roster"; state.stack = [{view:"curler", id:parts[1]}]; return; }
  if(["passport","locker","spiels","roster"].indexOf(parts[0]) > -1){ state.tab = parts[0]; state.stack = []; }
}

var activeSheet = null;

var sheetFocusable = 'button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

function visibleSheetControls(sheet){
  return Array.prototype.filter.call(sheet.querySelectorAll(sheetFocusable), function(node){
    return !node.hidden && node.type !== "hidden" && node.getAttribute("aria-hidden") !== "true" && node.getClientRects().length > 0;
  });
}
function openManagedSheet(sheetId, scrimId, trigger){
  var sheet = el(sheetId), scrim = el(scrimId);
  if(activeSheet && activeSheet.sheet !== sheet) closeManagedSheet(false);
  if(!activeSheet){
    activeSheet = { sheet:sheet, scrim:scrim, trigger:trigger && trigger.isConnected ? trigger : document.activeElement };
  }
  sheet.hidden = false;
  scrim.hidden = false;
  sheet.removeAttribute("inert");
  sheet.setAttribute("aria-hidden", "false");
  scrim.setAttribute("aria-hidden", "false");
  if(activeSheet.trigger && activeSheet.trigger.getAttribute("aria-controls") === sheetId){
    activeSheet.trigger.setAttribute("aria-expanded", "true");
  }
  // Commit the un-hidden state before adding the transition class so the
  // opening motion remains visible while focus moves deterministically now.
  void sheet.offsetWidth;
  sheet.classList.add("open");
  scrim.classList.add("open");
  var controls = visibleSheetControls(sheet);
  try{ (controls[0] || sheet).focus(); }catch(e){}
}
function closeManagedSheet(restoreFocus){
  if(!activeSheet) return;
  var closing = activeSheet;
  activeSheet = null;
  closing.sheet.classList.remove("open");
  closing.scrim.classList.remove("open");
  closing.sheet.setAttribute("inert", "");
  closing.sheet.setAttribute("aria-hidden", "true");
  closing.scrim.setAttribute("aria-hidden", "true");
  if(closing.trigger && closing.trigger.getAttribute("aria-controls") === closing.sheet.id){
    closing.trigger.setAttribute("aria-expanded", "false");
  }
  window.setTimeout(function(){
    if(!closing.sheet.classList.contains("open")){
      closing.sheet.hidden = true;
      closing.scrim.hidden = true;
    }
  }, 270);
  if(restoreFocus !== false && closing.trigger && closing.trigger.isConnected){
    try{ closing.trigger.focus(); }catch(e){}
  }
}

function validPractice(p){
  return p && ["date","minutes","drills","focus","observations"].every(function(k){return typeof p[k] === "string";}) &&
    /^\d{4}-\d{2}-\d{2}$/.test(p.date) && Number.isFinite(Date.parse(p.date)) && new Date(p.date).toISOString().slice(0,10) === p.date &&

      likes:0, comments:0, eventID:eventID, eventName:eventID ? (linked ? linked.name : existing.eventName || "Removed event") : "" };

    ["body","note","club"].forEach(function(k){if(p[k] !== undefined) require(str(p[k]));});

function backupSummary(s){
  function count(k){return Object.values(s[k]).reduce(function(n,a){return n+a.length;},0);}
  return s.posts.length + " posts · " + count("visits") + " visits · " + count("iceReads") + " ice readings · " + count("reviews") + " reviews · " + count("threads") + " messages · " + Object.keys(s.drafts).length + " drafts · " + s.addedSpiels.length + " events · " + s.addedCurlers.length + " curlers";
}
function openBackup(){
  closeSettings(); pendingBackup = null;
  openSheet('<h2>Backup and restore</h2><p>Export a private JSON file containing browser records and drafts. Keep it somewhere safe. This restores into this browser app for the same account. iOS and Classic use separate backups.</p>' +
    '<button class="b solid" data-action="export-backup">Export backup</button><div class="field"><label for="backup-file">Choose backup to preview</label><input id="backup-file" type="file" accept="application/json,.json"></div>' +
    (readJSON(storeKey()+":beforeRestore") ? '<button class="b outline" data-action="recover-backup">Preview previous browser records</button>' : '') +
    '<button class="b outline" data-action="close-sheet">Close</button>');
}
function exportBackup(){
  try {
    var data = validateBackup(makeBackup());
    var url = URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));
    var a = document.createElement("a"); a.href=url; a.download="CurlPlan Browser Backup.json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
    toast("Backup download requested. Check Downloads.");
  } catch(e){toast(e.message);}
}
function previewBackup(raw){
  pendingBackup = null;
  var checked = validateBackup(raw);
  openSheet('<h2>Restore preview</h2><p>' + esc(checked.createdAt) + '</p><p>' + esc(backupSummary(checked.state)) + '</p>' +
    '<p>This replaces browser records, drafts and messages. A recovery copy of current records is kept in this browser.</p>' +
    '<button class="b solid" data-action="restore-backup">Replace browser records</button><button class="b outline" data-action="close-sheet">Cancel</button>');
  pendingBackup = checked;
}
function restoreBackup(){
  try {
    var checked = validateBackup(pendingBackup);
    if(!window.confirm("Replace current browser records with this backup? A recovery copy will be kept.")) return false;
    var previous = makeBackup();
    if(!writeJSON(storeKey()+":beforeRestore", previous)) {toast("Could not save recovery copy. Nothing was restored."); return false;}
    if(!commitLocal(checked.state)) return false;
    pendingBackup = null; closeSheet(); gotoTab("passport"); toast("Records restored. Previous records are available in Backup and restore."); return true;
  } catch(e){toast(e.message);return false;}
}

document.addEventListener("change", async function(e){
  if(e.target.id !== "backup-file") return;
  pendingBackup = null;
  var file = e.target.files[0]; if(!file) return;
  try {
    if(file.size > 5000000) throw Error("Backup exceeds the 5 MB limit.");
    previewBackup(JSON.parse(await file.text()));
  } catch(error){toast(error.message);}
});
el("screen").addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  if(e.target.closest("button, a, input, select, textarea")) return;
  var control = e.target.closest('[role="button"][data-action]');
  if(!control) return;
  e.preventDefault();
  control.click();
});

el("screen").addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");

  // settings controls (live even without data-action wrapper actions)
  var themeBtn = e.target.closest("[data-theme-val]");
  if(themeBtn){ prefs.theme = themeBtn.getAttribute("data-theme-val"); applyPrefs(); savePrefs(); syncSettings(); return; }
  var accBtn = e.target.closest("[data-accent]");
  if(accBtn){ prefs.accent = accBtn.getAttribute("data-accent"); applyPrefs(); savePrefs(); syncSettings(); return; }
  if(e.target.closest("#toggle-pebble")){ prefs.pebble = !prefs.pebble; applyPrefs(); savePrefs(); syncSettings(); return; }

  if(!t) return;
  var action = t.getAttribute("data-action");
  currentActionTrigger = t;
  var id = t.getAttribute("data-id");
  var type = t.getAttribute("data-type");

  switch(action){
    case "tab":      gotoTab(t.getAttribute("data-tab")); break;
    case "stop":     push("stop", id); break;
    case "curler":   push("curler", id); break;
    case "back":     back(); break;
    case "backup": openBackup(); break;
    case "export-backup": exportBackup(); break;
    case "restore-backup": restoreBackup(); break;
    case "recover-backup": try { previewBackup(readJSON(storeKey()+":beforeRestore")); } catch(e){toast(e.message);} break;
    case "settings": openSettings(t); break;
    case "close-settings": closeSettings(); break;
    case "close-sheet":    closeSheet(); break;

    // locker filter + search (backported from iOS)
    case "locker-tab": ui.lockerTab = t.getAttribute("data-tab"); render(); break;
    case "toggle-locker-search": {
      ui.lockerSearch = !ui.lockerSearch; if(!ui.lockerSearch) ui.lockerQ = "";
      render(); var lq = el("locker-q"); if(lq) lq.focus();
      break;
    }
    case "toggle-roster-search": {
      ui.rosterSearch = !ui.rosterSearch; if(!ui.rosterSearch) ui.rosterQ = "";
      render(); var rq = el("roster-q"); if(rq) rq.focus();
      break;
    }
    // create entities (backported from iOS)
    case "prepare-lesson": openLessonPreparation(id); break;
    case "save-lesson": useLesson(id,val("f-event")); break;
    case "result-event": openResultEvent(id); break;
    case "new-spiel":         openNewSpiel(); break;
    case "submit-new-spiel":  submitNewSpiel(id || undefined); break;
    case "edit-event": openNewSpiel(id); break;
    case "delete-event": deleteEvent(id); break;
    case "new-curler":        openNewCurler(); break;
    case "edit-curler": openNewCurler(id); break;
    case "delete-curler": deleteRosterContact(id); break;
    case "submit-new-curler": submitNewCurler(); break;

    // demo session
    case "auth-demo": {
      auth.session = "demo"; saveAuth();
      refreshStore(); refreshMe(); enterApp();
      break;
    }
    case "signout": {
      signOut(); closeSettings(); refreshStore(); refreshMe();
      state.tab = "passport"; state.stack = [];
      render(); syncHash("replace"); toast("Signed out");
      break;
    }

    case "follow": {
      var c = curler(id);
      if(c){ var nv = !isFollowing(c); setFollowing(id, nv); render({keepScroll:true}); toast(nv ? "Following " + c.name : "Unfollowed " + c.name); }
      break;
    }
    // Local attendance intent
    case "join-spiel": {
      if(id && setSpielStatus(id, "Going")){ render({keepScroll:true}); toast("Going saved on this device; not a registration"); }
      break;
    }
    case "leave-spiel": {
      if(id && withdrawSpiel(id)){ render({keepScroll:true}); toast("Not going saved on this device"); }
      break;
    }

    case "attendance-intent": {
      if(setSpielStatus(id, t.getAttribute("data-status"))){ render({keepScroll:true}); toast("Attendance intent saved on this device"); }
      break;
    }

    // compose
    case "compose":      openCompose(); break;
    case "post-actions": openPostActions(id); break;
    case "edit-post": openCompose(null, id); break;
    case "delete-post": deleteOwnedRecord("post", id); break;
    case "discard-draft": discardEditorDraft(); break;
    case "compose-type": openCompose(type); break;
    case "submit-compose": submitCompose(type); break;

    // stop detail submissions
    case "log-visit":      openVisit(id); break;
    case "submit-visit":   submitVisit(id); break;
    case "add-iceread":    openIceRead(id); break;
    case "submit-iceread": submitIceRead(id); break;
    case "add-review":     openReview(id); break;
    case "review-actions": openReviewActions(t.getAttribute("data-stop"), id); break;
    case "edit-review": openReview(t.getAttribute("data-stop"), id); break;
    case "delete-review": deleteOwnedRecord("review", id, t.getAttribute("data-stop")); break;
    case "submit-review":  submitReview(id); break;
    case "pick-star":      setStars(parseInt(t.getAttribute("data-val"), 10)); persistEditorDraft(); break;

    // messaging
    case "message":   openThread(id); break;
    case "send-msg":  sendMessage(id); break;

    default: break;
  }
});

document.addEventListener("keydown", function(e){
  if(!activeSheet) return;
  if(e.key === "Escape"){
    e.preventDefault();
    if(activeSheet.sheet === el("sheet")) closeSettings(); else closeSheet();
    return;
  }
  if(e.key !== "Tab") return;
  var controls = visibleSheetControls(activeSheet.sheet);
  if(!controls.length){ e.preventDefault(); activeSheet.sheet.focus(); return; }
  var first = controls[0], last = controls[controls.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
